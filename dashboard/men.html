<meta charset="utf-8">
<title>競輪予測AI（男子）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7048e8">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="競輪予測AI">
<style>
:root{
  --bg:#f4f1fb; --surface:#ffffff; --surface2:#f7f4fd; --ink:#1e1633; --muted:#6b6480;
  --border:#e5dff2; --border2:#efe9f8; --accent:#7048e8; --accent-soft:#e9e2fb;
  --good:#2f9e44; --good-soft:#e4f5e8; --edge:#1098ad; --edge-soft:#d8f1f4;
  --loss:#e03131; --loss-soft:#fbe3e3; --warn:#e8a800;
  --shadow:0 1px 2px rgba(50,30,80,.06),0 8px 22px -12px rgba(50,30,80,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141019; --surface:#1d1726; --surface2:#231b30; --ink:#ece7f5; --muted:#9a8fb0;
  --border:#302640; --border2:#281f36; --accent:#9775fa; --accent-soft:#2a2140;
  --good:#51cf66; --good-soft:#173021; --edge:#3bc9db; --edge-soft:#0e2c30;
  --loss:#ff6b6b; --loss-soft:#331a1a; --warn:#f0c040;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.7);
}}
:root[data-theme="light"]{--bg:#f4f1fb;--surface:#ffffff;--surface2:#f7f4fd;--ink:#1e1633;--muted:#6b6480;--border:#e5dff2;--border2:#efe9f8;--accent:#7048e8;--accent-soft:#e9e2fb;--good:#2f9e44;--good-soft:#e4f5e8;--edge:#1098ad;--edge-soft:#d8f1f4;--loss:#e03131;--loss-soft:#fbe3e3;--warn:#e8a800;--shadow:0 1px 2px rgba(50,30,80,.06),0 8px 22px -12px rgba(50,30,80,.18);}
:root[data-theme="dark"]{--bg:#141019;--surface:#1d1726;--surface2:#231b30;--ink:#ece7f5;--muted:#9a8fb0;--border:#302640;--border2:#281f36;--accent:#9775fa;--accent-soft:#2a2140;--good:#51cf66;--good-soft:#173021;--edge:#3bc9db;--edge-soft:#0e2c30;--loss:#ff6b6b;--loss-soft:#331a1a;--warn:#f0c040;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.7);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:680px;margin:0 auto;padding:0 14px calc(48px + env(safe-area-inset-bottom))}

header{padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.16rem;letter-spacing:.01em}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.gen{margin-left:auto;font-size:.7rem;color:var(--muted);font-weight:500;text-align:right}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:9px;
  padding:6px 11px;font-size:.78rem;font-weight:700;font-family:inherit;cursor:pointer}

.notice{max-width:680px;margin:8px auto 0;padding:0 14px}
.notice .box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:11px;
  padding:9px 12px;font-size:.74rem;color:var(--ink);line-height:1.55}
.notice .box b{color:var(--accent)}

.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:24px 2px 4px}
.sub{font-size:.72rem;color:var(--muted);margin:0 2px 10px;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}

.badge{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
.badge.sample{background:var(--accent-soft);color:var(--accent)}
.badge.rrole{background:#0b7285;color:#fff;cursor:pointer}
.rrole-pop{display:inline-block;font-size:.62rem;font-weight:700;color:var(--ink);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
/* 勝ち上がり条件（着順ベース）を見出し直下に常時表示 */
.pred-cond{margin-top:6px;font-size:.74rem;font-weight:700;color:var(--ink);background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px;line-height:1.55}
.pred-cond .cl{color:var(--muted);font-weight:800;margin-right:4px}
.vtab .vday{font-size:.58rem;font-weight:800;color:#0b7285;margin-left:5px}
.vtab[aria-selected="true"] .vday{color:#fff}
.badge.pending{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--good-soft);color:var(--good)}

.empty{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:18px 14px;
  text-align:center;color:var(--muted);font-size:.82rem;line-height:1.6}

/* tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.82rem;min-width:460px}
table.t th{position:sticky;top:0;background:var(--surface2);font-size:.64rem;letter-spacing:.02em;color:var(--muted);
  font-weight:800;padding:8px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--border2);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:none}
.combo{font-weight:800;letter-spacing:.03em}
.evp{color:var(--good);font-weight:800}
.evp.lo{color:var(--muted)}
.rtag{font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rtag.axis{background:var(--good-soft);color:var(--good)}
.rtag.std{background:var(--edge-soft);color:var(--edge)}
.rtag.chaos{background:var(--accent-soft);color:var(--accent)}
/* 万車券率バッジ。しきいは実測（男子7車27.1%）を中心に lo<21% / mid<34% / hi */
.upt{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.upt.lo{background:var(--good-soft);color:var(--good)}
.upt.mid{background:var(--edge-soft);color:var(--edge)}
.upt.hi{background:var(--accent-soft);color:var(--accent)}
.upt.na{background:var(--surface2);color:var(--muted)}
.tfoot-row td{background:var(--surface2);font-weight:800;border-top:2px solid var(--border)}

/* toggle */
.secthead{display:flex;align-items:center;gap:8px;margin:24px 2px 4px;flex-wrap:wrap}
.secthead .sect{margin:0}
.sec-upd{margin-left:auto;font-size:.66rem;color:var(--muted);font-weight:600;white-space:nowrap;flex:none;display:none}
.sec-upd.on{display:inline-flex;align-items:center;gap:3px}
.sec-upd b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.secthead .vtoggle+.sec-upd,.secthead .sec-upd+.vtoggle{margin-left:8px}
.vtoggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none;margin-left:auto}
.vtoggle button{background:var(--surface);border:none;color:var(--muted);font-family:inherit;font-size:.72rem;
  font-weight:800;padding:5px 12px;cursor:pointer}
.vtoggle button[aria-pressed="true"]{background:var(--accent);color:#fff}
.vtoggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* heatmap */
.hmwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);background:var(--surface)}
table.hm{border-collapse:collapse;width:100%;min-width:520px;font-size:.8rem}
table.hm th{font-size:.66rem;color:var(--muted);font-weight:800;padding:8px 5px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--border)}
table.hm th.l,table.hm td.l{text-align:left;padding-left:10px}
table.hm td{padding:0;border-bottom:1px solid var(--border2);text-align:center}
table.hm td.l{padding:8px 10px;font-weight:800}
.hcell{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.08;border-radius:8px;margin:3px}
.hcell .r{font-weight:800;font-variant-numeric:tabular-nums;font-size:.92rem}
.hcell .n{font-size:.58rem;opacity:.8}
.hcell.empty{color:var(--muted);background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--border2) 5px,var(--border2) 6px)}
.legend{display:flex;gap:14px;justify-content:center;align-items:center;font-size:.68rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}

/* dist bars */
.barrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.78rem}
.barrow .bl{width:118px;flex:none;display:flex;align-items:center;gap:7px}
.bartrack{flex:1;height:22px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;position:relative;overflow:hidden}
.barfill{height:100%;border-radius:5px 0 0 5px}
.ref100{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.barrow .bv{width:74px;flex:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.dot-sw{width:11px;height:11px;border-radius:3px;flex:none}

/* svg charts */
.tksvg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.note{font-size:.7rem;color:var(--muted);margin-top:9px;line-height:1.6}
.kpirow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1 1 130px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.kpi .kl{font-size:.66rem;color:var(--muted);font-weight:700}
.kpi .kv{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.kpi .kv.pos{color:var(--good)} .kpi .kv.neg{color:var(--loss)}
.kpi .kn{font-size:.62rem;color:var(--muted);margin-top:2px}

/* data status */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.tile .tl{font-size:.66rem;color:var(--muted);font-weight:700}
.tile .tv{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.tile .tn{font-size:.62rem;color:var(--muted);margin-top:2px}
.fsrow{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.fspill{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:6px 11px;font-size:.74rem;font-weight:700}
.fspill b{color:var(--accent)}

/* predictions (本日のレース予測) */
.pred-disc{background:var(--warn);color:#3a2c00;border-radius:11px;padding:9px 12px;font-size:.73rem;line-height:1.55;font-weight:600;margin-bottom:14px}
:root[data-theme="dark"] .pred-disc{color:#1a1400}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pred-disc{color:#1a1400}}
.pred-venue{margin:0 0 12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.pred-venue>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:11px 14px;font-weight:800;font-size:.95rem;user-select:none}
.pred-venue>summary::-webkit-details-marker{display:none}
.pred-venue>summary .chev{margin-left:auto;color:var(--muted);font-size:.8rem;transition:transform .15s}
.pred-venue[open]>summary .chev{transform:rotate(90deg)}
.pred-venue>summary .vcount{font-size:.68rem;font-weight:700;color:var(--muted)}
.pred-races{padding:0 12px 6px}
.pred-race{border-top:1px solid var(--border2);padding:12px 2px 14px}
.pred-race:first-child{border-top:none}
.pred-rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pred-rno{font-weight:800;font-size:1.02rem}
.pred-rno small{font-size:.68rem;color:var(--muted);font-weight:700;margin-left:3px}
.pred-dl{font-size:.68rem;color:var(--muted);font-weight:700}
.pred-src{margin-left:auto;font-size:.6rem;color:var(--muted);font-weight:700;text-align:right}
.pred-top1{font-size:.66rem;color:var(--muted);font-weight:700;margin:2px 0 9px}
.pred-top1 b{color:var(--ink);font-variant-numeric:tabular-nums}
.carno{width:22px;height:22px;flex:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,.18)}
/* 出走表（列可変テーブル）。車/選手は横スクロールでも左に固定表示 */
.rt-wrap{margin:2px 0 2px}
table.rt{border-collapse:collapse;width:100%;min-width:max-content;font-size:.76rem}
table.rt th{position:sticky;top:0;z-index:1;background:var(--surface2);font-size:.6rem;letter-spacing:.02em;color:var(--muted);font-weight:800;padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
table.rt td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border2);font-variant-numeric:tabular-nums;font-weight:700}
table.rt th.l,table.rt td.l{text-align:left}
table.rt td.strong,table.rt th.strong{font-weight:800}
table.rt td.strong{color:var(--ink);font-size:.84rem}
table.rt td s{color:var(--muted);text-decoration:none;font-size:.82em;font-weight:700;margin-left:2px}
/* 横スクロールで残す固定列は 印→車→選手 の3つ。left は前の列幅の累積（22→52px）。
   印を足したときにここを直さないと、スクロール時に列が重なる */
table.rt th.rt-mk,table.rt td.rt-mk{position:sticky;left:0;z-index:2;width:22px;min-width:22px;text-align:center;padding-left:2px;padding-right:2px;background:var(--surface)}
table.rt th.rt-mk{z-index:3;background:var(--surface2)}
table.rt th.rt-car,table.rt td.rt-car{position:sticky;left:22px;z-index:2;width:30px;min-width:30px;text-align:center;padding-left:4px;padding-right:4px;background:var(--surface)}
table.rt th.rt-car{z-index:3;background:var(--surface2)}
table.rt th.rt-name,table.rt td.rt-name{position:sticky;left:52px;z-index:2;background:var(--surface);font-weight:800;vertical-align:top}
table.rt td.rt-name{padding-top:6px}
table.rt th.rt-name{z-index:3;background:var(--surface2)}
/* 選手の位置別成績バッジ。列を増やさずに済ませるため選手セルに置く */
.ls-b{display:inline-flex;align-items:center;gap:2px;margin:3px 0 1px;padding:1px 6px;
  font-size:.58rem;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;
  border:1px solid var(--border);border-radius:999px;background:var(--surface2);color:var(--muted)}
.ls-b i{font-style:normal;font-size:.5rem}
.ls-b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ls-r>td{padding:0 8px 8px;background:var(--surface2)}
.ls-p{display:flex;flex-direction:column;gap:6px;padding:7px 0 2px;max-width:520px}
.ls-t table{border-collapse:collapse;font-size:.68rem;width:100%;max-width:340px}
.ls-t th,.ls-t td{padding:3px 8px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--border2);font-variant-numeric:tabular-nums}
.ls-t thead th{font-size:.58rem;color:var(--muted);font-weight:800}
.ls-t tbody th{text-align:left;font-weight:800;color:var(--ink)}
.ls-t tr.cur{background:var(--accent-soft)}       /* 今回の位置 */
.ls-t tr.cur th{color:var(--accent)}
.ls-t tr.off{opacity:.45}
.ls-cs{display:flex;flex-wrap:wrap;gap:4px}
.ls-c{font-size:.6rem;font-weight:700;color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:7px;padding:2px 7px;white-space:nowrap}
.ls-c b{color:var(--ink);font-size:.68rem;margin-left:2px}
.ls-c s{color:var(--muted);text-decoration:none;font-size:.9em;margin-left:2px}
.ls-n{font-size:.55rem;color:var(--muted);font-weight:600;line-height:1.4}
/* 買い目の合成オッズと実測成績。予測だけ出すと当たる気にさせるので必ず並べる */
.ft-row2{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 5px 2px}
.so,.ms{font-size:.58rem;font-weight:700;color:var(--muted);border-radius:6px;
  padding:1px 6px;white-space:nowrap;background:var(--surface2)}
.so b{color:var(--ink);font-size:.7rem;margin:0 2px}
.so s{text-decoration:none;color:var(--muted);margin-left:4px;font-size:.92em}
.so.na{opacity:.7}
.ms{background:var(--edge-soft);color:var(--edge)}
/* モデル予測（この買い目を買ったときの的中確率）。実測と並べて読ませる */
.pm{font-size:.58rem;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap;
  background:var(--accent-soft);color:var(--accent)}
.pm b{font-size:.72rem;margin:0 2px}
.pm s{text-decoration:none;opacity:.85;margin-left:4px}
/* 展開をまたぐ統合買い目。分岐ごとの買い目より前に置き、先に全体像を見せる */
.mg{border:1px solid var(--accent);border-radius:10px;padding:8px 10px;margin:2px 0 10px;
  background:var(--accent-soft)}
.mg-h{font-size:.62rem;font-weight:800;color:var(--accent);letter-spacing:.02em;margin-bottom:5px}
.mg-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:3px 0;
  border-top:1px solid var(--border2)}
.mg-row:first-of-type{border-top:0}
.mg-pts{font-size:.62rem;font-weight:800;color:var(--muted);margin-left:auto}
.mg-tag{font-size:.58rem;font-weight:800;color:var(--accent);background:var(--surface);
  border-radius:5px;padding:1px 5px}
.mg-pr{font-size:.6rem;font-weight:800;color:var(--muted);min-width:2.6em}
.mg-sum{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:5px 0 3px;
  border-top:1px dashed var(--border)}
.mg-sum>b{font-size:.78rem;color:var(--ink)}
.mg-lbl{font-size:.58rem;font-weight:800;color:var(--muted);min-width:4.4em}
.mg-cut{padding:4px 0 2px}
.mg-cuth{font-size:.58rem;font-weight:800;color:var(--loss);margin-bottom:3px}
.mg-c{display:inline-block;font-size:.6rem;font-weight:700;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;margin:0 3px 3px 0;text-decoration:line-through}
.mg-c s{text-decoration:none;opacity:.8;margin-left:3px}
.mg-form{font-size:.82rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.mg-p{font-size:.6rem;font-weight:700;color:var(--muted)}
.mg-p b{color:var(--ink);font-size:.72rem}
.mg-ref{font-size:.58rem;font-weight:700;color:var(--muted);margin-top:5px;
  padding-top:5px;border-top:1px dashed var(--border)}
/* 出走表に統合した今場所成績（選手名の下） */
.rt .rn-nm{display:block;white-space:nowrap;font-weight:800}
.rt .rn-home{display:inline-block;margin-left:6px;font-size:.56rem;font-weight:800;color:#fff;background:#e8590c;border-radius:5px;padding:1px 5px;vertical-align:middle;letter-spacing:.03em}
.rt .rn-home.dist{background:var(--muted)}
.rt .rn-meet{display:flex;gap:5px;align-items:baseline;margin-top:2px;font-size:.6rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rt .rn-meet .rn-md{color:var(--muted)}
.rt .rn-meet .rn-mr{color:var(--muted)}
.rt .rn-meet .rn-mp{color:var(--ink);font-weight:800}
.rt .rn-meet .rn-mp.p1{color:#e03131}
.rt .rn-meet .rn-mp.p3{color:var(--accent)}
.rt .rn-meet .rn-ml{color:var(--muted)}
table.rt tr.rt-top td{background:var(--accent-soft)}
table.rt tr.rt-top td.rt-car,table.rt tr.rt-top td.rt-name{background:var(--accent-soft)}
/* レース番号タブ（会場選択後に表示） */
.pred-rtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.pred-rtab{background:var(--surface);border:1px solid var(--border);color:var(--ink);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 11px;border-radius:9px;min-width:52px}
.pred-rtab .rn{font-size:.82rem;font-weight:800;font-variant-numeric:tabular-nums}
.pred-rtab .dl{font-size:.58rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pred-rtab .done{font-size:.54rem;font-weight:800;color:var(--good)}
.pred-rtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pred-rtab[aria-selected="true"] .dl,.pred-rtab[aria-selected="true"] .done{color:rgba(255,255,255,.85)}
.pred-rtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pred-rpanel .pred-vbox{border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:2px 14px 12px}
/* レース内 予測／確定結果 タブ */
.rc-tabs{display:flex;gap:6px;margin:10px 0 4px}
.rc-tab{flex:1 1 0;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:.8rem;font-weight:800;padding:8px 10px;border-radius:10px;cursor:pointer}
.rc-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rc-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rc-pane[hidden]{display:none}
/* 確定結果 */
.res{margin:6px 0 12px;border:1px solid var(--good);border-radius:11px;background:var(--good-soft);overflow:hidden}
.res-head{padding:8px 11px;font-size:.78rem;font-weight:800;color:var(--good);display:flex;align-items:center;gap:8px}
.res-head .res-time{margin-left:auto;font-size:.62rem;font-weight:700;color:var(--muted)}
.res .tblwrap{border-radius:0;border-left:none;border-right:none;background:var(--surface)}
table.res-t{font-size:.76rem}
table.res-t th.res-pos,table.res-t td.res-pos{position:static;width:26px;min-width:26px;text-align:center;font-weight:800}
table.res-t th.res-car,table.res-t td.res-car{position:static;width:30px;min-width:30px;text-align:center}
table.res-t tr.res-tr.p1 td{background:var(--accent-soft)}
table.res-t td.res-pos{color:var(--ink)}
table.res-t tr.p1 td.res-pos{color:#e03131;font-size:.9rem}
.res-sb{font-size:.6rem;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 3px;margin-left:2px}
.res-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 11px;font-size:.72rem;font-weight:700;color:var(--ink)}
.res-foot .res-yen{color:var(--good);font-variant-numeric:tabular-nums}
.res-foot .res-pop{font-size:.64rem;color:var(--muted);font-weight:700}
.res-hit{font-size:.64rem;font-weight:800;border-radius:999px;padding:2px 9px}
.res-hit.ok{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.res-hit.ng{background:var(--surface2);color:var(--muted);border:1px solid var(--border2)}
/* 列表示・並び順の設定パネル */
.cc{margin:0 0 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.cc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:.76rem;font-weight:800;user-select:none}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary .cc-hint{font-size:.62rem;font-weight:700;color:var(--muted)}
.cc>summary .chev{margin-left:auto;color:var(--muted);font-size:.8rem;transition:transform .15s}
.cc[open]>summary .chev{transform:rotate(90deg)}
.cc>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cc-body{padding:2px 12px 12px}
.cc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cc-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:5px 9px}
.cc-chk{flex:1 1 auto;display:flex;align-items:center;gap:8px;font-size:.76rem;font-weight:700;cursor:pointer}
.cc-chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.cc-move{flex:none;display:flex;gap:4px}
.cc-btn{width:30px;height:28px;border:1px solid var(--border);background:var(--surface);border-radius:7px;color:var(--ink);font-size:.7rem;cursor:pointer;font-family:inherit}
.cc-btn:disabled{opacity:.35;cursor:default}
.cc-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cc-actions{margin-top:9px}
.cc-reset{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:6px 12px;font-size:.72rem;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}
.cc-note{font-size:.62rem;color:var(--muted);font-weight:600;margin:8px 0 0;line-height:1.5}
.pred-tfhead{font-size:.64rem;letter-spacing:.04em;color:var(--muted);font-weight:800;margin:12px 2px 5px;text-transform:uppercase}
.oddson{color:var(--good);font-weight:800}
/* 展開予想（並び予想＝車番のみ1行 ＋ 展開パターン） */
.dev{margin:10px 2px 4px;padding:10px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface2)}
.dev-head{font-size:.72rem;font-weight:800;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink)}
.dev-src{font-size:.6rem;color:var(--muted);font-weight:600}
.dev-narabi-h,.dev-pat-h{font-size:.6rem;letter-spacing:.03em;color:var(--muted);font-weight:800;margin:9px 2px 4px;text-transform:uppercase}
.dev-line{display:flex;flex-wrap:nowrap;align-items:center;gap:3px;overflow-x:auto;padding-bottom:2px}
/* 印は車番の上。印が無い車でも高さを揃えて車番の行が波打たないようにする */
.dev-node{display:inline-flex;flex-direction:column;align-items:center;gap:0;
  background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:1px 5px 2px;flex:none}
.dev-mk{display:block;height:.82em;line-height:.82em}
.dev-mk .mk{font-size:.66rem}
/* 地元/地区は車番の下。無い車も高さを確保して車番の行を揃える */
.dev-hm{display:block;height:.78em;line-height:.78em;font-size:.5rem;font-weight:800;
  letter-spacing:.02em;color:transparent}
.dev-hm.me{color:#fff;background:#e8590c;border-radius:4px;padding:0 3px}
.dev-hm.ds{color:var(--muted)}
.dev-arrow{color:var(--muted);font-size:.62rem;flex:none}
.dev-fav{color:#e8590c;font-weight:800}
/* 競り＝どちらが番手になるか未定。直列の▶と明確に別物として見えるようにする */
.ln-seri{flex:none;font-size:.55rem;font-weight:800;color:#9c36b5;
  background:rgba(156,54,181,.14);border-radius:5px;padding:1px 3px}
.dev-node.sr,.ln-node.sr{border:1px dashed #9c36b5}
/* ライン内は詰めて1かたまりに見せる。枠はライン単位で持ち、車番の枠は消す。
   ▶はライン間だけなので「987▶143▶25▶6」とライン構造がそのまま読める */
.dev-grp{display:inline-flex;align-items:center;gap:1px;flex:none;
  background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px 5px}
.dev-grp .dev-node{background:none;border:0;padding:0;border-radius:0;gap:1px}
.dev-paren{flex:none;color:#9c36b5;font-weight:800;font-size:.78rem}
/* 印＝AIの1着確率順位（記者の印ではない）。◎○▲△ を並び予想と出走表で共通に使う */
.mk{flex:none;display:inline-flex;align-items:center;justify-content:center;
  min-width:1.05em;font-weight:800;font-size:.72rem;line-height:1}
.mk.mk1{color:#e8590c} .mk.mk2{color:#1c7ed6} .mk.mk3{color:#2f9e44} .mk.mk4{color:var(--muted)}
/* ---- ウィンチケット風の2段タブ（会場→レース）。上部に固定してレースを切り替える ---- */
.tabwrap{position:sticky;top:0;z-index:25;background:var(--bg);
  padding-top:6px;margin:0 -14px;padding-left:14px;padding-right:14px;
  box-shadow:0 6px 10px -8px rgba(0,0,0,.35)}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;
  scrollbar-width:none;-ms-overflow-style:none}
.tabbar::-webkit-scrollbar{display:none}
.vtab,.rtab{flex:none;display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:4px 10px;font-weight:800;cursor:pointer;white-space:nowrap;
  font-family:inherit;line-height:1.15}
.vtab{font-size:.76rem}
.rtab{font-size:.8rem;min-width:2.9em}
.vtab small,.rtab small{font-size:.55rem;font-weight:700;color:var(--muted)}
.vtab[aria-selected="true"],.rtab[aria-selected="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff}
.vtab[aria-selected="true"] small,.rtab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.rtab.done{opacity:.55}
.rtab.live{border-color:var(--edge);box-shadow:inset 0 0 0 1px var(--edge)}
.rtab[aria-selected="true"].live{box-shadow:none}
/* 確定済み: 表示していた買い目が当たったかを枠色で示す。
   的中は淡色化(.done)を戻して目立たせる（当たった回だけ拾いたいので） */
.rtab.hit{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good);opacity:1}
.rtab.miss{border-color:var(--border2)}
.rtab[aria-selected="true"].hit{box-shadow:none;border-color:var(--good)}
/* 万車券率のバッジ。選択中タブでも読めるよう背景は自前で持つ（親の反転色に負けない） */
.rtab .rt-up{margin-top:1px;font-size:.56rem;font-weight:800;border-radius:999px;
  padding:0 4px;font-variant-numeric:tabular-nums}
.rtab .rt-up.lo{background:var(--good-soft);color:var(--good)}
.rtab .rt-up.mid{background:var(--edge-soft);color:var(--edge)}
.rtab .rt-up.hi{background:var(--accent-soft);color:var(--accent)}
.rtab .rt-up.na{background:var(--surface2);color:var(--muted)}
.tablegend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:0 0 6px;
  font-size:.6rem;color:var(--muted);font-weight:700}
.tablegend .upt{font-size:.55rem;padding:1px 6px}
.lg-hit{color:var(--good)}
.tabhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:2px 0 7px;
  font-size:.7rem;color:var(--muted);font-weight:700}
.tabhead .nm{font-size:.92rem;font-weight:800;color:var(--ink)}
.rt-mk{width:1.4em;text-align:center;padding-left:2px;padding-right:2px}
.dev-pats{display:flex;flex-direction:column;gap:5px}
.dev-pat{display:flex;align-items:center;gap:8px;font-size:.72rem}
.dev-pat-i{width:1.3em;text-align:center;flex:none}
.dev-pat-l{font-weight:700;min-width:9.5em}
.dev-pat-p{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);min-width:2.8em;text-align:right}
.dev-pat-c{color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.dev-bs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.74rem;font-weight:700}
.dev-bs b{color:var(--accent)}
.dev-bs-2{color:var(--muted);font-weight:600}
.dev-bs-hit{font-size:.58rem;color:var(--muted);font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.dev-bs-div{margin-top:4px}
.dev-div{font-size:.62rem;font-weight:800;color:#fff;background:#e8590c;border-radius:5px;padding:2px 7px}
.dev-agree{font-size:.62rem;font-weight:700;color:var(--muted)}
.dev-pace{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.72rem;font-weight:700}
.dev-pace-lv{font-size:.62rem;font-weight:800;color:#fff;border-radius:5px;padding:2px 7px}
.dev-pace-lv.lv-hi{background:#e8590c}.dev-pace-lv.lv-mid{background:var(--accent)}.dev-pace-lv.lv-lo{background:var(--muted)}
.dev-pace-n{color:var(--ink)}
.dev-pace-note{color:var(--muted);font-weight:600}
.dev-pace-km{font-size:.62rem;color:var(--muted);font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.dev-note{font-size:.7rem;font-weight:600;line-height:1.55;color:var(--ink);margin-top:8px}
.dev-caveat{font-size:.62rem;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.5}
/* 展開シナリオ上位3（実測分岐比）。◎勝ち=緑系・◎負け=アクセント系で地色を分ける */
.sc{margin-top:9px}
.sc-item{border:1px solid var(--border2);border-radius:9px;padding:7px 9px;margin-top:6px;background:var(--surface)}
.sc-item.lose{border-color:var(--accent-soft);background:var(--accent-soft)}
.sc-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sc-rank{font-size:.6rem;font-weight:800;color:var(--muted);min-width:1.2em}
.sc-key{font-size:.72rem;font-weight:800;color:var(--ink)}
.sc-prob{margin-left:auto;font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--good)}
.sc-item.lose .sc-prob{color:var(--accent)}
.sc-bar{height:4px;border-radius:999px;background:var(--surface2);margin-top:5px;overflow:hidden}
.sc-bar>span{display:block;height:100%;background:var(--good)}
.sc-item.lose .sc-bar>span{background:var(--accent)}
.sc-line{display:flex;gap:6px;margin-top:5px;font-size:.63rem;font-weight:600;line-height:1.5}
.sc-lbl{flex:none;width:4.6em;color:var(--muted);font-weight:700}
.sc-dist{color:var(--ink);font-variant-numeric:tabular-nums}
.sc-dist b{font-weight:800}
.sc-fav{margin-top:5px;font-size:.63rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sc-fav em{font-style:normal;color:var(--good);font-weight:800}
.sc-ins{margin-top:9px;padding:8px 10px;border-radius:9px;background:var(--surface2);
  font-size:.65rem;font-weight:600;line-height:1.6;color:var(--ink)}
.sc-ins li{margin:3px 0 3px 1.1em}
.sc-ins .h{font-weight:800;font-size:.68rem;display:block;margin-bottom:3px}
/* 隊列位置別の1着確率（横棒）。前→後の順序尺度なので単一色相のランプ（前=濃/後=淡）。
   dataviz の ordinal 検証を通過: 単調・隣接ΔL 0.093/0.095・淡端 2.11:1 / 2.15:1・色相幅3° */
.pp{--p0:#1c5cab;--p1:#2a78d6;--p2:#5598e7;--p3:#86b6ef;margin-top:4px}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .pp{
  --p0:#184f95;--p1:#2a78d6;--p2:#5598e7;--p3:#9ec5f4}}
:root[data-theme="dark"] .pp{--p0:#184f95;--p1:#2a78d6;--p2:#5598e7;--p3:#9ec5f4}
.pp-row{margin:7px 0}
.pp-h{display:flex;align-items:baseline;gap:6px}
.pp-i{font-size:.8rem;flex:none}
.pp-l{font-size:.68rem;font-weight:800;color:var(--ink)}
.pp-p{margin-left:auto;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.pp-bar{height:9px;border-radius:0 4px 4px 0;background:var(--surface2);margin-top:3px;overflow:hidden}
.pp-bar>span{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.pp-bar>span.s0{background:var(--p0)} .pp-bar>span.s1{background:var(--p1)}
.pp-bar>span.s2{background:var(--p2)} .pp-bar>span.s3{background:var(--p3)}
.pp-bar>span.sx{background:var(--border)}
.pp-mem{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:4px}
.pp-m{display:inline-flex;align-items:center;gap:3px}
.pp-mn{font-size:.62rem;font-weight:700;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:6.5em}
/* 全車の主導権確率。1変数の大小比較なので単一色（sequentialの既定）。最有力のみ濃色で強調 */
.bs-list{margin-top:6px}
.bs-row{display:flex;align-items:center;gap:7px;margin:3px 0}
.bs-car{display:inline-flex;align-items:center;gap:4px;flex:none;min-width:8.5em}
.bs-nm{font-size:.63rem;font-weight:700;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:5.5em}
.bs-tag{font-size:.55rem;font-weight:800;padding:1px 5px;border-radius:999px;
  background:var(--surface2);color:var(--muted);white-space:nowrap}
.bs-bar{flex:1;height:8px;border-radius:0 4px 4px 0;background:var(--surface2);overflow:hidden;min-width:40px}
.bs-bar>span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--edge);opacity:.45;min-width:2px}
.bs-bar>span.top{opacity:1}
.bs-p{flex:none;font-size:.66rem;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--ink);min-width:2.4em;text-align:right}
/* バンク特性。諸元は説明用（予測根拠ではない）ので主張の弱い地色にする */
.bk{margin:8px 0 10px;padding:9px 11px;border:1px solid var(--border2);border-radius:11px;background:var(--surface2)}
.bk-head{font-size:.72rem;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:7px}
.bk-v{font-size:.66rem;font-weight:700;color:var(--muted)}
.bk-nums{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.bk-nums span{display:flex;align-items:baseline;gap:4px;font-size:.62rem;color:var(--muted);font-weight:700}
.bk-nums b{font-size:1rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.bk-nums em{font-style:normal}
.bk-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.bk-chip{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--surface);color:var(--muted);border:1px solid var(--border2)}
.bk-adv{margin-top:7px;font-size:.7rem;font-weight:800;padding:5px 9px;border-radius:8px}
.bk-adv.esc{background:var(--good-soft);color:var(--good)}
.bk-adv.sas{background:var(--edge-soft);color:var(--edge)}
.bk-adv.mak{background:var(--accent-soft);color:var(--accent)}
.bk-adv.flat{background:var(--surface);color:var(--muted);font-weight:700}
.bk-kim{margin-top:5px;font-size:.63rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bk-kim.sub{color:var(--muted)}
/* 展開6パターンの円グラフ。dataviz検証済みカテゴリカル配色（6スロット固定順）。
   light/darkとも 明度帯・彩度・CVD分離・通常視力フロアを通過（輪の折返しペア含む）。
   lightでは magenta/yellow/aqua が3:1未満のため、全スライスに直接ラベルを必須とする。 */
.pie{--s1:#2a78d6;--s2:#008300;--s3:#e87ba4;--s4:#eda100;--s5:#1baf7a;--s6:#eb6834;
  margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .pie{
  --s1:#3987e5;--s2:#008300;--s3:#d55181;--s4:#c98500;--s5:#199e70;--s6:#d95926}}
:root[data-theme="dark"] .pie{--s1:#3987e5;--s2:#008300;--s3:#d55181;--s4:#c98500;--s5:#199e70;--s6:#d95926}
.pie-svg{flex:none}
.pie-svg path{stroke:var(--surface);stroke-width:2}   /* スライス間2pxのサーフェス間隙 */
.pie-c1{font-size:.58rem;font-weight:700;fill:var(--muted)}
.pie-c2{font-size:1.05rem;font-weight:800;fill:var(--ink)}

/* predictions: venue tabs */
.pred-vtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pred-vtab{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:.78rem;font-weight:800;padding:7px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}

/* 日付タブ（昨日/今日/明日）。会場タブより一段上の階層なので枠線を強めて区別する */

.pred-dtab{background:var(--surface2);border:1.5px solid var(--border2);color:var(--muted);

  cursor:pointer;display:flex;align-items:center;gap:6px}

  border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.pred-dtab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* predictions: EV block */

/* EV買い目: 全買いサマリ・1着車タブ・車頭別サマリ */

/* predictions: 三連単オッズテーブル（1着固定マトリクス） */

.om-legend{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:.64rem;color:var(--muted);margin-top:9px}

<script>
// 画面(HTML)の版。機能を変えたら上げる。
const UI_VERSION = "2026-08-13";
// ==== 以下 index.html と共通の表示部品（見た目のみ。ロジック・データは男女で独立）====
const yen = v => v==null ? "—" : "¥"+Math.round(v).toLocaleString();
const pct1 = v => v==null ? "—" : (v*100).toFixed(1)+"%";
const pctR = v => v==null ? "—" : Math.round(v*100)+"%";
const oddsF = v => v==null ? "—" : v.toFixed(1);
const esc = s => (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cssvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();


// 各セクションの更新時刻チップ。ライブ更新される予測/推奨は last_updated（1分ごと）、
// 集計系（バケット/分布/較正/実績/ROI/収集）は data.json 生成時刻 generated を表示。

// notice

// status badge helper
const STATUS_BADGE = { sample:['sample','サンプル'], pending:['pending','未算出'],
  ready:['ok','算出済'], ok:['ok','実データ'], none:['pending','対象なし'] };
function badge(st){ const b=STATUS_BADGE[st]||STATUS_BADGE.pending;
  return `<span class="badge ${b[0]}">${b[1]}</span>`; }
function isShown(st){ return st==="sample"||st==="ready"||st==="ok"; }
const rtagCls = t => t==="軸堅"?"axis":(t==="混戦"?"chaos":"std");
// 波乱確率＝**万車券率**（三連単の払戻が1万円以上になる確率）。
// 旧表示は 1−P(◎1着)＝「◎が1着を外す確率」を「波乱確率」と称していた。男子25,335Rの
// 実測に対し 平均57.98% vs 万車券率の実測28.92% ＝ 約2倍を波乱として出していた。
// 現行は モデルの三連単分布のうち、実測から推定したしきい値以下の目の確率を合計する。
// **検証を通していない層（男子9車）は upset_prob 自体が入らない** ので「—」になる。
// 男子7車: 予測26.8% / 実測27.0% / ECE 0.0148（src/model/upset.py）
const upsetOf = r => (r.upset_prob!=null ? r.upset_prob : null);
// 確定済みレースで「全分岐をケアする買い目」が当たったか。
// 判定対象は**画面に出しているフォーメーション（足切り前）**。足切りは任意の絞り込みなので
// 素の買い目で判定する。結果が無い／買い目が無いレースは null（色を付けない）。
function planHit(r){
  const res = r.result || {}, P = (r.dev_branches||{}).merged;
  const cb = (res.payout||{}).combo;
  if(!cb || !P || !(P.forms||[]).length) return null;
  const p = String(cb).split("-").map(Number);
  if(p.length!==3 || p.some(isNaN)) return null;
  return (P.forms||[]).some(f =>
    (f.first||[]).indexOf(p[0])>=0 && (f.second||[]).indexOf(p[1])>=0
    && (f.third||[]).indexOf(p[2])>=0);
}
// しきいは実測の万車券率（男子7車 27.0%）を中心に置く。旧しきい0.30/0.55は旧指標の尺度
const uptCls = u => u==null ? "na" : (u<0.21 ? "lo" : (u<0.34 ? "mid" : "hi"));
const UPT_TIP = "万車券率＝三連単の払戻が1万円以上になる確率。"
  + "男子7車20,722レースの実測(27.1%)から較正（walk-forward: ECE 0.015・定数予測よりBrier良）。"
  + "9車は標本が薄く事前基準を満たさなかったため表示しない（—）。"
  + "高い＝荒れやすいが、その荒れはオッズにも織り込み済みで穴狙いの根拠にはならない。";
const uptTag = u => u==null ? `<span class="upt na">—</span>`
  : `<span class="upt ${uptCls(u)}" title="${UPT_TIP}">${pct1(u)}</span>`;
function emptyBox(msg){ return `<div class="empty">${esc(msg)}</div>`; }

// ROI diverging color: gray midpoint at 1.0, green above, red below
function roiColor(roi){
  if(roi==null) return "var(--surface2)";
  const good=cssvar("--good"), loss=cssvar("--loss"), surf=cssvar("--surface");
  if(roi>=1){ const t=Math.min((roi-1)/0.3,1); return `color-mix(in srgb, ${good} ${(18+t*52).toFixed(0)}%, ${surf})`; }
  const t=Math.min((1-roi)/0.4,1); return `color-mix(in srgb, ${loss} ${(14+t*46).toFixed(0)}%, ${surf})`;
}
const roiTextCol = roi => roi==null?"var(--muted)":(roi>=1?"var(--good)":"var(--loss)");
const CARCOL = {
  1:["#ffffff","#111"], 2:["#242424","#fff"], 3:["#e03131","#fff"],
  4:["#1c7ed6","#fff"], 5:["#f2d600","#111"], 6:["#2f9e44","#fff"],
  7:["#f76707","#fff"], 8:["#f06595","#fff"], 9:["#7048e8","#fff"]
};
function carChip(n){ const c=CARCOL[n]||["var(--surface2)","var(--ink)"];
  return `<span class="carno" style="background:${c[0]};color:${c[1]}">${n}</span>`; }
// 印は**モデルの1着確率の順位**。riders は1着確率降順で格納済みなので先頭から割り当てる。
// 新聞の印（記者の主観）ではなくAIの序列であることに注意。5番手以降は無印。
const MARKS = ["◎","○","▲","△"];
function marksOf(r){
  const m = {};
  (r.riders||[]).forEach((rd,i)=>{ if(i<MARKS.length && rd.car!=null) m[rd.car]=MARKS[i]; });
  return m;
}
const markCls = k => k==="◎"?"mk1":(k==="○"?"mk2":(k==="▲"?"mk3":"mk4"));
const markChip = k => k?`<span class="mk ${markCls(k)}">${k}</span>`:"";
const oddsCell = v => (v==null||v>=9999) ? "—" : v.toFixed(1);
const sub = s => s!=null && s!=="" ? `<s>${s}</s>` : "";       // 補助数値（走数など）
const COLUMNS = [
  {key:"win",   label:"1着確率",  th:"1着確率", cls:"strong", get:rd=>pct1(rd.win_prob)},
  {key:"synth", label:"合成オッズ", th:"合成",  cls:"", get:rd=> rd.synth_odds_1st!=null?(+rd.synth_odds_1st).toFixed(1)+"倍":"—"},
  {key:"leg",   label:"脚質",      th:"脚",    cls:"", get:rd=> esc(rd.leg||"—")},
  {key:"score", label:"得点",      th:"得点",  cls:"", get:rd=>(rd.score||0).toFixed(1)},
  {key:"wr",    label:"直近勝率",  th:"勝率",  cls:"", get:rd=> rd.win_rate!=null?pctR(rd.win_rate):"—"},
  {key:"fair",  label:"必要オッズ", th:"必要",  cls:"", get:rd=> rd.fair_odds_1st!=null?(+rd.fair_odds_1st).toFixed(1)+"倍":"—"},
  {key:"career",label:"通算勝率",  th:"通算",  cls:"", get:rd=> rd.career_win_rate!=null?`${(rd.career_win_rate*100).toFixed(1)}%${sub((rd.career_starts||0)+"走")}`:"—"},
  {key:"r5",    label:"直近5走平均着", th:"直近5走", cls:"", get:rd=> rd.recent5_finish!=null?rd.recent5_finish.toFixed(1)+"着":"—"},
  {key:"venue", label:"当地勝率",  th:"当地",  cls:"", get:rd=> (rd.venue_win_rate!=null&&rd.venue_starts)?`${(rd.venue_win_rate*100).toFixed(0)}%${sub(rd.venue_starts+"走")}`:"—"},
  {key:"days",  label:"出走間隔",  th:"間隔",  cls:"", get:rd=> rd.days_since!=null?rd.days_since+"日":"—"},
  // 脚質プロファイル（直近1年）。S=スタート先頭 B=バック先頭 / 逃捲差=1着決まり手回数
  {key:"s",     label:"S回数(直近1年)", th:"S", cls:"", get:rd=> rd.s_cnt!=null?rd.s_cnt:"—"},
  {key:"b",     label:"B回数(直近1年)", th:"B", cls:"", get:rd=> rd.b_cnt!=null?rd.b_cnt:"—"},
  {key:"nige",  label:"逃げ1着(直近1年)", th:"逃", cls:"", get:rd=> rd.nige!=null?rd.nige:"—"},
  {key:"makuri",label:"捲り1着(直近1年)", th:"捲", cls:"", get:rd=> rd.makuri!=null?rd.makuri:"—"},
  {key:"sashi", label:"差し1着(直近1年)", th:"差", cls:"", get:rd=> rd.sashi!=null?rd.sashi:"—"},
];
const colByKey = Object.fromEntries(COLUMNS.map(c=>[c.key,c]));
const DEFAULT_ORDER = COLUMNS.map(c=>c.key);
const DEFAULT_HIDDEN = ["fair","days"];       // 既定は控えめ（設定でいつでも表示）
const LS_KEY = "keirin_pred_cols_v1";
function loadCfg(){
  try{ const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");
    if(j && Array.isArray(j.order)) return {order:j.order.slice(), hidden:(j.hidden||[]).slice()};
  }catch(e){}
  return {order:DEFAULT_ORDER.slice(), hidden:DEFAULT_HIDDEN.slice()};
}
function saveCfg(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }catch(e){} }
let cfg = loadCfg();
DEFAULT_ORDER.forEach(k=>{ if(!cfg.order.includes(k)) cfg.order.push(k); });   // 新列は末尾に補完
cfg.order = cfg.order.filter(k=>colByKey[k]);
cfg.hidden = cfg.hidden.filter(k=>colByKey[k]);
function activeCols(){ return cfg.order.filter(k=>!cfg.hidden.includes(k)).map(k=>colByKey[k]); }

// ---- 選手の位置別成績・戦法系の実績（バッジ＋クリックで展開）----
// 列を増やすと横スクロールが伸びて読めなくなるので、選手セルにバッジを1つ置き、
// 押したときだけ全項目を全幅の行で開く。バッジには**今回の位置での実績**を出す
// （一番知りたい数字がそれなので、開かなくても分かるようにする）。
const LS_POS = ["先頭","番手","3番手以降","単騎"];
function lsPosOf(rd, r){
  const lines = r.lines||[];
  for(const mem of lines){
    const i = mem.indexOf(rd.car);
    if(i>=0) return mem.length<=1 ? "単騎" : (i===0?"先頭":(i===1?"番手":"3番手以降"));
  }
  return null;
}
// n が薄い率は rate=null で返ってくる（src/features/rider_line_stats.py MIN_N=5）。
// その場合は「—」にして分母だけ見せる。数字を出すと信じられてしまうため。
const lsRate = o => (!o||o.rate==null) ? "—" : Math.round(o.rate*100)+"%";
const lsFrac = o => !o ? "" : `<s>(${o.k!=null?o.k:o.win_k}/${o.n})</s>`;
function lsBadge(rd, r){
  const ls = rd.line_stats; if(!ls) return "";
  const lab = lsPosOf(rd, r);
  const p = lab ? (ls.pos||{})[lab] : null;
  const head = lab ? (p && p.win!=null ? `${lab} ${Math.round(p.win*100)}%`
                                       : `${lab} —`) : "成績";
  return `<button class="ls-b" type="button" data-ls="${rd.car}"`
    +` aria-expanded="false" title="今回の位置での過去成績。押すと全項目">`
    +`${esc(head)}<i>▾</i></button>`;
}
function lsPanel(rd, r){
  const ls = rd.line_stats; if(!ls) return "";
  const cur = lsPosOf(rd, r);
  const rows = LS_POS.map(k=>{
    const p = (ls.pos||{})[k];
    if(!p) return `<tr class="off"><th>${k}</th><td>—</td><td>—</td><td>0走</td></tr>`;
    return `<tr class="${k===cur?"cur":""}"><th>${k}</th>`
      +`<td>${p.win!=null?Math.round(p.win*100)+"%":"—"}</td>`
      +`<td>${p.top3!=null?Math.round(p.top3*100)+"%":"—"}</td>`
      +`<td>${p.n}走</td></tr>`;
  }).join("");
  // 戦法系。飛びつき成功率は位置取り推移が保存されていないため項目自体を置かない
  const one = (lab,o,tip)=>`<span class="ls-c" title="${esc(tip)}">${lab} `
    +`<b>${lsRate(o)}</b>${lsFrac(o)}</span>`;
  return `<div class="ls-p"><div class="ls-t"><table><thead><tr>`
    +`<th>ライン位置</th><th>1着</th><th>3着内</th><th>走数</th></tr></thead>`
    +`<tbody>${rows}</tbody></table></div>`
    +`<div class="ls-cs">`
    + one("かまし", ls.kamashi, "並び予想の脚質がカマシのレースで主導権(B)を取れた率")
    + one("つっぱり", ls.tsuppari, "先行/押え先で、同レースにカマシ宣言者が居るときに主導権(B)を守れた率")
    + one("競り", ls.seri, "競りの相手より上位で入った率。競りは全レースの1.5%しかなく標本が薄い")
    + one("ライン分断(先頭時)", ls.cut_head, "自分が先頭で3着内、番手が着外だった率。意図的に切ったかは区別できない")
    + one("ライン分断(番手時)", ls.cut_mate, "自分が番手で着外、先頭が3着内だった率。同上")
    + `</div>`
    + `<div class="ls-n">— は走数5未満で率を出していない。飛びつき成功率は`
    + `レース中の位置取り推移が保存されておらず算出できない。</div></div>`;
}

// 出走表（設定した列・順で描画。riders は1着確率降順で格納済み → 先頭=本命行を強調）
function riderTable(r){
  const cols = activeCols();
  const mk = marksOf(r);
  const head = `<th class="rt-mk">印</th><th class="rt-car">車</th><th class="rt-name l">選手</th>`
    + cols.map(c=>`<th class="${c.cls}">${c.th}</th>`).join("");
  const body = (r.riders||[]).map((rd,i)=>{
    const tds = cols.map(c=>`<td class="${c.cls}">${c.get(rd)}</td>`).join("");
    // 今場所成績を選手名の下に統合（新しい開催日から順に、初日を除く最大日数分）
    const meet = (rd.meet||[]).slice().reverse();
    const meetHtml = meet.map(m=>{
      const pos=m[2], pcls = pos===1?" p1":(pos!=null&&pos<=3?" p3":"");
      return `<span class="rn-meet"><span class="rn-md">${fmtMD(m[0])}</span>`
        +`<span class="rn-mr">${m[1]!=null?m[1]+"R":""}</span>`
        +`<span class="rn-mp${pcls}">${pos!=null?pos+"着":"—"}</span>`
        +(m[3]!=null?`<span class="rn-ml">上${(+m[3]).toFixed(1)}</span>`:"")+`</span>`;
    }).join("");
    return `<tr${i===0?' class="rt-top"':''}>`
      +`<td class="rt-mk">${markChip(mk[rd.car])}</td>`
      +`<td class="rt-car">${carChip(rd.car)}</td>`
      +`<td class="rt-name l"><span class="rn-nm">${esc(rd.name||"")}`
      +`${rd.home?`<span class="rn-home" title="地元(同県)開催">地元</span>`:(rd.home_dist?`<span class="rn-home dist" title="同地区開催">地区</span>`:"")}`
      +`</span>${lsBadge(rd,r)}${meetHtml}</td>${tds}</tr>`
      + (rd.line_stats ? `<tr class="ls-r" data-lsrow="${rd.car}" hidden>`
          +`<td colspan="${cols.length+3}">${lsPanel(rd,r)}</td></tr>` : "");
  }).join("");
  return `<div class="tblwrap rt-wrap"><table class="rt"><thead><tr>${head}</tr></thead>`
    +`<tbody>${body}</tbody></table></div>`;
}

// 今場所成績は出走表(riderTable)の選手名の下に統合表示（imsBlockは廃止）。
const fmtMD = d => { const m=/^\d{4}-(\d{2})-(\d{2})/.exec(d||""); return m?`${+m[1]}/${+m[2]}`:esc(d||""); };

// 確定結果（発走後に取得）: 着順・上り・決まり手・払戻＋予測的中を表示。
function resultBlock(r){
  const R = r.result;
  if(!R || !(R.order||[]).length) return "";
  const rows = R.order.map(o=>{
    const pcls = o.pos===1?" p1":(o.pos!=null&&o.pos<=3?" p3":"");
    return `<tr class="res-tr${pcls}">`
      +`<td class="res-pos">${o.pos!=null?o.pos:"—"}</td>`
      +`<td class="res-car">${carChip(o.car)}</td>`
      +`<td class="l">${esc(o.name||"")}</td>`
      +`<td>${o.last_lap!=null?(+o.last_lap).toFixed(1):"—"}</td>`
      +`<td class="l">${esc(o.kimarite||"")}${o.sb?` <span class="res-sb">${esc(o.sb)}</span>`:""}</td></tr>`;
  }).join("");
  const p = R.payout;
  const payTxt = p
    ? `三連単 <b>${esc(p.combo)}</b> <b class="res-yen">¥${Number(p.yen).toLocaleString()}</b>`
      +(p.pop!=null?` <span class="res-pop">${p.pop}番人気</span>`:"")
    : "払戻情報なし";
  const h = R.hit||{};
  let hitTxt = "";
  if(h.win_hit!=null)
    hitTxt += `<span class="res-hit ${h.win_hit?"ok":"ng"}">本命${h.win_hit?"的中":"不的中"}</span>`;
  if(h.tri_rank!=null)
    hitTxt += `<span class="res-hit ${h.tri_rank<=10?"ok":"ng"}">三連単 モデル${h.tri_rank}位</span>`;
  else if("tri_rank" in h)
    hitTxt += `<span class="res-hit ng">三連単 モデル圏外</span>`;
  return `<div class="res"><div class="res-head">🏁 確定結果`
    +(R.fetched_at?`<span class="res-time">取得 ${esc(String(R.fetched_at).slice(11))}</span>`:"")+`</div>`
    +`<div class="tblwrap"><table class="rt res-t"><thead><tr>`
    +`<th class="res-pos">着</th><th class="res-car">車</th><th class="l">選手</th><th>上り</th><th class="l">決まり手</th>`
    +`</tr></thead><tbody>${rows}</tbody></table></div>`
    +`<div class="res-foot"><span class="res-pay">${payTxt}</span>${hitTxt}</div></div>`;
}

// 出走者同士の過去対戦成績（同一レースでの着順比較）マトリクス。行=当該車の先着 - 相手の先着。
function h2hBlock(r){
  const h = r.h2h;
  if(!h || !h.cars || h.cars.length<2 || !h.cell || !Object.keys(h.cell).length)
    return "";
  const cars = h.cars;
  const head = `<th class="h2h-corner">先着＼相手</th>`+cars.map(c=>`<th>${carChip(c)}</th>`).join("");
  const body = cars.map(row=>{
    const rec = h.cell[row]||{};
    const tds = cars.map(col=>{
      if(row===col) return `<td><div class="h2h-cell dead">—</div></td>`;
      const x = rec[col];
      if(!x || !x.n) return `<td><div class="h2h-cell na">—</div></td>`;
      const cls = x.w>x.l ? " adv" : (x.w<x.l ? " dis" : "");
      return `<td><div class="h2h-cell${cls}">`
        +`<span class="wl">${x.w}-${x.l}</span><span class="n">${x.n}戦</span></div></td>`;
    }).join("");
    return `<tr><th class="h2h-rh">${carChip(row)}</th>${tds}</tr>`;
  }).join("");
  const names = cars.map(c=>`${c}=${esc(h.names[c]||"")}`).join("　");
  return `<details class="h2h"><summary aria-label="過去対戦成績の開閉">`
    +`<span class="h2h-ttl">🤼 過去の対戦成績</span>`
    +`<span class="h2h-lab">同一レースでの着順比較</span><span class="chev">▸</span></summary>`
    +`<div class="h2h-body"><div class="tblwrap"><table class="h2h-t"><thead><tr>${head}</tr></thead>`
    +`<tbody>${body}</tbody></table></div>`
    +`<div class="h2h-legend"><span><span class="h2h-sw adv"></span>先着優位</span>`
    +`<span><span class="h2h-sw dis"></span>劣位</span><span>数字＝当該車の先着-相手の先着（戦=対戦数）</span></div>`
    +`<div class="h2h-names">${names}</div></div></details>`;
}

// EV買い目（最新オッズ×モデルの参考値。買い目推奨ではない）。combos: [1着,2着,3着,オッズ,確率,EV]。
// 1着車で表示切替し、車番順(2着→3着 昇順)に並べてフォーメーション購入を容易にする。
const EV_THR = 1.10;
let evUid = 0;
const evReg = {};
function _evSummary(buys){
  const prob = buys.reduce((s,c)=>s+(c[4]||0),0);                 // 的中率=モデル確率の総和
  const inv = buys.reduce((s,c)=>s+(c[3]>0?1/c[3]:0),0);          // 合成オッズ=1/Σ(1/オッズ)
  return {n: buys.length, prob, synth: inv>0?1/inv:null};
}
function renderEvGrid(uid, head){
  const g = evReg[uid]||{};
  const buys = (g.buys||[]).filter(c=>c[0]===head)
    .sort((x,y)=> (x[1]-y[1]) || (x[2]-y[2]));                    // 車番順(2着→3着)
  if(!buys.length) return `<div class="om-none">この車頭でEV≥${EV_THR.toFixed(2)}の買い目なし</div>`;
  const s = _evSummary(buys);
  const sub = `<div class="ev-subsum">${carChip(head)}頭 <b>${s.n}</b>点買い ｜ 的中率 <b>${(s.prob*100).toFixed(1)}%</b> ｜ 合成 <b>${s.synth!=null?s.synth.toFixed(1):"—"}倍</b></div>`;
  const rows = buys.map(c=>`<tr>`
    +`<td class="l combo">${c[0]}-${c[1]}-${c[2]}</td>`
    +`<td>${(c[4]*100).toFixed(1)}%</td>`
    +`<td>${(+c[3]).toFixed(1)}</td>`
    +`<td class="evp">${c[5].toFixed(2)}</td></tr>`).join("");
  return sub + `<div class="tblwrap"><table class="t"><thead><tr>`
    +`<th class="l">買い目</th><th>モデル確率</th><th>オッズ</th><th>EV</th>`
    +`</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function evBlock(r){
  const combos = r.combos||[];
  const hasOdds = combos.some(c=>c[3]!=null && c[3]<9999);
  if(!hasOdds)
    return `<div class="pred-ev"><div class="pred-ev-none">オッズ未発売</div></div>`;
  const buys = combos.filter(c=>c[3]!=null && c[3]<9999 && c[5]!=null && c[5]>=EV_THR);
  if(!buys.length)
    return `<div class="pred-ev"><div class="pred-ev-none">最新オッズでEV≥${EV_THR.toFixed(2)}の買い目なし</div></div>`;
  const uid = evUid++;
  evReg[uid] = {buys};
  const heads = [...new Set(buys.map(c=>c[0]))].sort((a,b)=>a-b);
  const init = heads[0];
  const all = _evSummary(buys);
  const tabs = heads.map(c=>`<button class="ev-tab" type="button" role="tab" data-ev="${uid}" data-car="${c}"`
    +` aria-selected="${c===init?"true":"false"}" tabindex="${c===init?0:-1}" aria-label="1着 ${c}番">`
    +`${carChip(c)}<span class="ev-tc">${buys.filter(b=>b[0]===c).length}</span></button>`).join("");
  return `<div class="pred-ev">`
    +`<div class="pred-ev-head">🎯 最新オッズでEV≥${EV_THR.toFixed(2)}の買い目 <span class="nb">${buys.length}点</span></div>`
    +`<div class="ev-allsum">全${all.n}点を購入した場合 ｜ 的中率 <b>${(all.prob*100).toFixed(1)}%</b>（モデル確率の総和）｜ 合成オッズ <b>${all.synth!=null?all.synth.toFixed(1):"—"}倍</b></div>`
    +`<div class="ev-sel" role="tablist" aria-label="1着車の選択"><span class="om-sellab">1着</span>${tabs}</div>`
    +`<div id="ev-grid-${uid}">${renderEvGrid(uid, init)}</div>`
    +`<div class="pred-ev-note">車番順（2着→3着）で表示。EV=モデル確率×オッズ。合成オッズ=1/Σ(1/オッズ)。`
    +`参考値でエッジ未確立・買い目推奨ではありません。</div>`
    +`</div>`;
}

// 二車単の買い目（P8: ◎軸固定→相手を市場人気薄で2〜3点。発走5分前オッズでEV）。
// 三連単の展開買い目で的中の土台、二車単で妙味を取る役割分担。回収率<100%（黒字ではない）。
function exactaBlock(r){
  const x = r.exacta;
  if(!x || !x.buys || !x.buys.length) return "";
  const rows = x.buys.map(b=>`<tr><td class="l combo">${esc(b.combo)}</td>`
    +`<td>${pct1(b.prob)}</td><td>${oddsF(b.odds)}</td>`
    +`<td class="hl-ev${b.ev>=1?"":" none"}">${b.ev!=null?(+b.ev).toFixed(2):"—"}</td></tr>`).join("");
  return `<div class="pred-ev exacta">`
    +`<div class="pred-ev-head">🎫 二車単の買い目 <span class="nb">${x.points}点</span> <span class="more">${esc(x.policy||"")}</span></div>`
    +`<div class="ev-allsum">◎${carChip(x.anchor)}軸 ｜ 的中率 <b>${(x.hit_prob*100).toFixed(1)}%</b> ｜ 合成オッズ <b>${x.synth_odds!=null?(+x.synth_odds).toFixed(1):"—"}倍</b>${r.odds_at?` ｜ <b>${esc(r.odds_at)}</b>時点のオッズ`:""}</div>`
    +`<div class="tblwrap"><table class="t"><thead><tr>`
    +`<th class="l">買い目</th><th>モデル確率</th><th>オッズ</th><th>EV</th>`
    +`</tr></thead><tbody>${rows}</tbody></table></div>`
    +`<div class="pred-ev-note">${esc(x.note||"")} EV=モデル確率×オッズ。合成オッズ=1/Σ(1/オッズ)。</div>`
    +`</div>`;
}

// 三連単オッズテーブル（1着固定マトリクス。確率×市場オッズの比較・買い目推奨ではない）
let omUid = 0;
const omReg = {};
function omCars(uid){
  const g=omReg[uid]||{}; const s=new Set();
  (g.combos||[]).forEach(x=>{ s.add(x[0]); s.add(x[1]); s.add(x[2]); });
  let cars=[...s].filter(v=>v!=null).sort((a,b)=>a-b);
  if(!cars.length && g.field_size){ for(let i=1;i<=g.field_size;i++) cars.push(i); }
  return cars;
}
function renderOmGrid(uid, A){
  const g=omReg[uid]||{}; const combos=g.combos||[];
  const cars=omCars(uid).filter(c=>c!==A);
  const map={};
  combos.forEach(x=>{ if(x[0]===A) map[x[1]+"-"+x[2]]=x; });
  const head=`<th class="om-corner">2着＼3着</th>`+cars.map(c=>`<th>${carChip(c)}</th>`).join("");
  const body=cars.map(row=>{
    const tds=cars.map(col=>{
      if(row===col) return `<td><div class="om-cell dead">—</div></td>`;
      const x=map[row+"-"+col];
      const odds=x?x[3]:null, prob=x?x[4]:null, ev=x?x[5]:null;
      if(odds==null) return `<td><div class="om-cell na">—</div></td>`;
      const hi = ev!=null && ev>1;
      return `<td><div class="om-cell${hi?' hi':''}">`
        +`<span class="o">${(+odds).toFixed(1)}</span>`
        +`<span class="p">${prob!=null?(prob*100).toFixed(1)+"%":""}</span>`
        +(hi?`<span class="e">EV${ev.toFixed(2)}</span>`:"")
        +`</div></td>`;
    }).join("");
    return `<tr><th class="om-rh">${carChip(row)}</th>${tds}</tr>`;
  }).join("");
  return `<table class="om-t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function omBlock(r){
  const uid=omUid++;
  const combos=r.combos||[];
  omReg[uid]={combos, field_size:r.field_size||0};
  const firstCars=omCars(uid).filter(c=>combos.some(x=>x[0]===c));
  if(!combos.length || !firstCars.length){
    return `<div class="pred-tfhead">三連単 オッズテーブル</div><div class="om-none">オッズテーブルは未生成</div>`;
  }
  const topCar = (r.riders&&r.riders[0])?r.riders[0].car:null;
  const initCar = firstCars.includes(topCar)?topCar:firstCars[0];
  const tabs=firstCars.map(c=>`<button class="om-tab" type="button" role="tab" data-om="${uid}" data-car="${c}"`
    +` aria-selected="${c===initCar?"true":"false"}" tabindex="${c===initCar?0:-1}"`
    +` aria-label="1着 ${c}番を固定">${carChip(c)}</button>`).join("");
  // 毎回参照する情報のため常時表示（アコーディオンにしない）。
  return `<div class="om">`
    +`<div class="om-head"><span class="om-ttl">🔢 三連単オッズテーブル</span>`
    +`<span class="om-lab" id="om-lab-${uid}">1着 ${initCar} 固定</span></div>`
    +`<div class="om-body">`
    +`<div class="om-sel" role="tablist" aria-label="1着車の固定"><span class="om-sellab">1着固定</span>${tabs}</div>`
    +`<div class="tblwrap"><div id="om-grid-${uid}">${renderOmGrid(uid,initCar)}</div></div>`
    +`<div class="om-legend"><span><span class="om-sw"></span>期待値1超（モデル確率＞市場オッズ）</span>`
    +`<span>—＝未発売／不成立</span></div>`
    +`<div class="pred-ev-note">セル＝三連単オッズ（上）＋モデル確率（下）。色付き＝モデル確率に対しオッズが高いセル（EV&gt;1）。`
    +`確率と市場オッズの比較であり、エッジ確立・買い目推奨ではありません。</div>`
    +`</div></div>`;
}

// 種別→勝ち上がりの一言説明（男子は決着傾向に直結）
function roleDesc(role){
  const m={"予選":"上位が準決勝へ／先行が主導権で堅め","準決勝":"上位が決勝へ・高ステークス／先行(逃)が勝ち堅い",
    "決勝":"優勝決定戦／先行・単騎の強豪","選抜":"最終日の敗者戦／追込で荒れやすい",
    "一般":"最終日の敗者戦／追込で荒れやすい","特選":"特別選抜戦"};
  return role&&m[role]?`${role}: ${m[role]}`:"";
}
// バッジのポップ表示: 実際の勝ち上がり条件(着順ベース)があればそれを、無ければ種別の一言説明。
function roleText(r){
  const R=r.role||{};
  if(R.condition) return "勝ち上がり条件： "+R.condition;
  return roleDesc(R.role) || R.class_role || "";
}
// 勝ち上がり条件を常時1行で全文表示（読点→／、と→・で整形）。条件が無い決勝/敗者戦は非表示。
function condLine(r){
  const c=r.role&&r.role.condition;
  if(!c) return "";
  const t=c.replace(/、/g,"／").replace(/と/g,"・");
  return `<div class="pred-cond"><span class="cl">🏁 勝ち上がり</span>${esc(t)}</div>`;
}
function raceHead(r){
  // 万車券率は1着確率と足して100%にはならない別の量。top1 は自前で取る
  const up = upsetOf(r);
  const top1 = (r.top1_prob!=null) ? r.top1_prob
    : ((r.riders && r.riders[0] && r.riders[0].win_prob)!=null ? r.riders[0].win_prob : null);
  return `<div class="pred-rhead">`
    +`<span class="pred-rno">${r.race_no!=null?r.race_no:"?"}<small>R</small></span>`
    +`<span class="rtag ${rtagCls(r.race_type)}">${esc(r.race_type||"—")}</span>`
    +((r.role&&r.role.class_role)?`<span class="badge rrole" role="button" tabindex="0" title="${esc(roleText(r))}">${esc(r.role.class_role)}</span><span class="rrole-pop" hidden>${esc(roleText(r))}</span>`:"")
    +(r.is_girls?`<span class="badge sample">ガールズ</span>`:"")
    +(r.field_size?`<span class="pred-dl">${r.field_size}車</span>`:"")
    +(r.deadline?`<span class="pred-dl">締切 ${esc(r.deadline)}</span>`:"")
    +(r.updated_at?`<span class="pred-rupd">更新 ${esc(String(r.updated_at).slice(11,16)||r.updated_at)}</span>`:"")
    +(r.final_locked?`<span class="final-badge" title="発走5分前の確定オッズでEV・合成オッズ・二車単買い目を最終更新">🔒 発走前確定${r.final_update_time?" "+esc(r.final_update_time):""}</span>`:"")
    +`<span class="pred-src">${esc(r.source||"")}</span>`
    +`</div>`
    +`<div class="pred-top1">1着確率トップ <b>${pct1(top1)}</b>　万車券率 ${uptTag(up)}`
    +`　正規化エントロピー <b>${r.entropy!=null?r.entropy.toFixed(2):"—"}</b></div>`
    + condLine(r);
}
// 予測タブの中身（出走表・対戦・三連単モデル確率・EV買い目・オッズテーブル）
function predContent(r){
  const tf = (r.top_trifecta||[]).map(t=>{
    const cover = (t.odds!=null && t.odds<9999 && t.need_odds!=null && t.odds>=t.need_odds);
    return `<tr><td class="l combo">${esc(t.combo)}</td>`
      +`<td>${pct1(t.prob)}</td>`
      +`<td>${oddsF(t.need_odds)}</td>`
      +`<td class="${cover?'oddson':''}">${oddsCell(t.odds)}</td></tr>`;
  }).join("");
  const tfBlock = tf
    ? `<div class="pred-tfhead">三連単 モデル確率 上位</div>`
      +`<div class="tblwrap"><table class="t"><thead><tr>`
      +`<th class="l">着順</th><th>モデル確率</th><th>必要オッズ</th><th>市場オッズ</th>`
      +`</tr></thead><tbody>${tf}</tbody></table></div>` : "";
  // ライン表示は出走表の直後（並びを見てから展開を読む順序）
  // ライン→展開分岐→従来の展開予想 の順（並びを見て、分岐を読み、詳細へ）
  // 出走表 → 並び予想（誰がどのラインか）→ ライン別の強さ → 展開分岐 の順。
  // 並びを最初に見せないと、以降のライン評価や分岐が何を指しているか読めない。
  // 出走表 → 並び予想 → 展開分岐と買い目 → ライン別の強さ の順。
  // 展開を読んだ直後に買い目を見せ、ラインの数値評価はその裏付けとして後ろに置く。
  return riderTable(r) + devBlock(r) + branchBlock(r) + lineBlock(r) + h2hBlock(r) + tfBlock
       + refBlock(r) + evBlock(r) + omBlock(r);
}
// 展開分岐（男子）: 「誰が主導権を取るか」で場合分けし、分岐ごとに買い目を出す。
// 主導権の確率は展開AI(62.5%的中)、分岐内の着順は実測の役割別シェアへ合わせた条件付き分布。
// **買い目の推奨ではない**（期待値ゾーンは検証済みで存在しない）。展開の読み・紐選びの材料。
// 「この展開でAが勝ったとき、2着・3着は誰か」。分岐分布を1着で条件付けただけで、
// 追加のモデルは使っていない。役割は**勝者から見た**相対位置（買い目を勝者から読むため）。
// 実測(25,235R): 2着は勝者のライン内から56.3% / 3着は他ラインから62.6% と構造が逆転する。
// 買い目の型（◎頭 / ◎2着 / ◎3着 / ◎抜き）。◎を1着に固定する必要はない。
// 実測では **◎の1着的中は43.6%＝56%は◎が勝たない**ので、◎を2着・3着に置く型と
// ◎を外す型も確率つきで並べる。walk-forward検証で型の出現確率の平均絶対誤差0.63pt。
// 合成オッズ＝1/Σ(1/オッズ)。**どの目で当たっても同じ額が返るよう資金配分したときの倍率**で、
// 均等買いの平均ではない。均等だと当たる目で回収が何倍も変わるのでレンジも併記する。
// オッズが揃うのは締切間近の更新（発売前は出ない → 「発売前」と出す）。
// 取得時刻を必ず添える。締切までオッズは動くので、いつ時点の合成なのかが分からないと
// 数字を読めない（レース単位で1回の取得なので時刻はレース共通）。
let ODDS_AT = null;
function synthTag(o){
  if(!o || o.synth==null) return `<span class="so na">オッズ発売前</span>`;
  const part = (o.covered!=null && o.points!=null && o.covered<o.points)
    ? `<s>${o.covered}/${o.points}点</s>` : "";
  const at = ODDS_AT ? `<s>${esc(ODDS_AT)}時点</s>` : "";
  return `<span class="so">合成 <b>${o.synth.toFixed(1)}倍</b>`
    +`<s>${o.min.toFixed(1)}〜${o.max.toFixed(1)}倍</s>${part}${at}</span>`;
}
// 型ごとの**実測**の的中率と回収率（walk-forward out-of-sample）。予測だけ出すと
// 当たる気にさせるので、実際にどうだったかを必ず並べる。回収率の上限は控除率25%より75%。
let FORM_STATS = {};        // data_men.json の formation_stats を bootMen で入れる
function measTag(kind){
  const s = (FORM_STATS||{})[kind];
  if(!s) return "";
  return `<span class="ms" title="過去の walk-forward 実測（無条件の的中率と回収率）。`
    +`平均${s.points}点。回収率の上限は控除率25%のため75%">`
    +`実測 的中${Math.round(s.hit*100)}% / 回収${Math.round(s.roi*100)}%</span>`;
}
// この買い目を実際に買ったときの的中確率＝**全分岐の混合分布での確率合計**。
// 「型内○%」は展開が起きた前提の条件付きなので別物（他の展開でも当たり得る）。
//
// **期待値（モデル確率×合成オッズ）は出さない。** 控除率25%のもとで
// 期待値 = 0.75 ×（モデル確率 ÷ 市場確率）になるので、この値が1を超えるのは
// 「モデルが市場より高く見積もっている」だけの意味しかない。そして
// モデルが市場と乖離する買い目ほど当たらないことは検証済み（4.21.2 で
// 「EV順に選ぶと予測10%に対し実測3.7%」）。**買いたくなる方向に系統的に外れる数字**
// なので画面に出さない。判断材料は「モデル予測」と「実測」を並べる形にする。
function pmodelTag(f, o){
  if(!f || f.p_model==null) return "";
  return `<span class="pm" title="このフォーメーション（${f.points||0}点）の目に`
    +`モデルが置いている確率の合計。全分岐の混合分布で計算しており、`
    +`「型内○%」（その展開が起きた前提の条件付き）とは別物">`
    +`モデル予測 <b>${(f.p_model*100).toFixed(1)}%</b></span>`;
}
function typesHtml(b, pc){
  const T = b.form_types||[];
  if(!T.length) return "";
  const rows = T.map(t=>{
    const f=t.formation||{};
    return `<div class="ft-row">`
      +`<span class="ft-kind ${t.kind==="◎抜き"?"out":""}">${esc(t.kind)}</span>`
      +`<span class="ft-sp">${pc(t.scenario_prob)}</span>`
      +`<b class="ft-form">${esc(f.text||"")}</b>`
      +`<span class="ft-pts">${f.points||0}点</span>`
      +`<span class="ft-cov">型内${pc(t.cover)}</span>`
      +`</div><div class="ft-row2">${pmodelTag(f, t.odds)}${synthTag(t.odds)}`
      +`${measTag(t.kind)}</div>`;
  }).join("");
  return `<div class="ft">`
    +`<div class="ft-h">◎の置き場所ごとの買い目</div>`
    + rows + `</div>`;
}

function condHtml(b, nm, pc){
  const C = b.conditional||[];
  if(!C.length) return "";
  const cars = xs => (xs||[]).map(x=>
    `<span class="cd-node">${carChip(x.car)}`
    +`<span class="ln-nm">${esc(x.name||"")}</span>`
    +`<span class="cd-role">${esc(x.role||"")}</span>`
    +`<span class="cd-p">${pc(x.prob)}</span></span>`).join("");
  return `<details class="cd"><summary>勝者別の2着・3着</summary>`
    + C.map(cd=>`<div class="cd-row">`
        +`<div class="cd-h">${carChip(cd.car)}`
        +`<span class="cd-nm">${esc(cd.name||"")}</span>`
        +`<span class="cd-if">が勝つなら</span>`
        +`<span class="cd-wp">${pc(cd.prob)}</span></div>`
        +`<div class="cd-line"><span class="cd-lbl">2着</span>${cars(cd.second)}`
        +`<span class="cd-in">ライン内 ${pc(cd.second_inline)}</span></div>`
        +`<div class="cd-line"><span class="cd-lbl">3着</span>${cars(cd.third)}`
        +`<span class="cd-in">ライン内 ${pc(cd.third_inline)}</span></div>`
        +`</div>`).join("")
    +`</details>`;
}

function branchBlock(r){
  const B = r.dev_branches;
  // 分岐が無いレースでも二車単買い目だけは出す（この関数内に集約したため）
  if(!B || !(B.branches||[]).length) return exactaBlock(r);
  ODDS_AT = r.odds_at || null;      // 合成オッズの「いつ時点か」（レース共通）
  const pc = v => v==null ? "—" : Math.round(v*100)+"%";
  const nm = {};
  (r.riders||[]).forEach(x=>{ nm[x.car]=x.name; });
  const rows = B.branches.map((b,i)=>{
    const f = b.formation||{};
    const line = (b.line||[]).map(c=>
      `<span class="br-node">${carChip(c)}<span class="ln-nm">${esc(nm[c]||"")}</span></span>`)
      .join(`<span class="ln-link">－</span>`);
    // 分岐内の1着上位3人。展開が変わると誰が浮上するかが読める
    const win = Object.entries(b.win||{}).map(([c,p])=>[+c,p])
      .sort((a,b2)=>b2[1]-a[1]).slice(0,3);
    return `<div class="br-row">`
      +`<div class="br-h"><span class="br-tag">展開${"ABCDE"[i]||""}</span>`
      +`<span class="br-lbl">${esc(b.label||"")}</span>`
      +`<span class="br-p">${pc(b.prob)}</span></div>`
      +`<div class="br-bar"><span style="width:${Math.max(2,Math.round((b.prob||0)*100))}%"></span></div>`
      +`<div class="br-cars">${line}</div>`
      +(f.text?`<div class="br-buy"><span class="br-buylbl">買い目</span>`
        +`<b class="br-form">${esc(f.text)}</b>`
        +`<span class="br-pts">${f.points}点</span>`
        +`<span class="br-cov">この展開の${pc(f.cover)}をカバー</span></div>`
        +`<div class="ft-row2">${pmodelTag(f, f.odds)}${synthTag(f.odds)}</div>`:"")
      + typesHtml(b, pc)
      + condHtml(b, nm, pc)
      +`</div>`;
  }).join("");
  // 展開をまたぐ統合買い目。分岐ごとに買うと点数が倍々になるので、
  // 1つの買い目で全分岐をケアする案を点数別に並べる（削る判断は見る側に委ねる）。
  // 全分岐をケアする買い目。**複数フォーメーションのまま**点数を P(展開) で配分して削る。
  // 足切りは合成オッズを上げるために行い、外した目を必ず一覧で出す（黙って消さない）。
  const P0 = B.merged, ME = B.merged_each;
  const stat = (s, lbl) => !s ? "" :
    `<div class="mg-sum"><span class="mg-lbl">${lbl}</span>`
    +`<b>${s.points}点</b>`
    +`<span class="mg-p">モデル予測 <b>${((s.p_model||0)*100).toFixed(1)}%</b></span>`
    +(s.synth!=null
      ? `<span class="so">合成 <b>${s.synth.toFixed(1)}倍</b>`
        +`<s>${s.min.toFixed(1)}〜${s.max.toFixed(1)}倍</s>`
        +(ODDS_AT?`<s>${esc(ODDS_AT)}時点</s>`:"")+`</span>`
      : `<span class="so na">オッズ発売前</span>`)
    +`</div>`;
  let merged = "";
  if(P0 && (P0.forms||[]).length){
    const frows = P0.forms.map((f,i)=>
      `<div class="mg-row"><span class="mg-tag">展開${"ABCDE"[i]||""}</span>`
      +`<span class="mg-pr">${pc(f.prob)}</span>`
      +`<b class="mg-form">${esc(f.text||"")}</b>`
      +`<span class="mg-pts">${f.points}点</span></div>`).join("");
    const cuts = (P0.cut||[]).length
      ? `<div class="mg-cut"><div class="mg-cuth">`
        +`${P0.floor}倍以下を足切り（${P0.cut.length}点を除外）</div>`
        + P0.cut.map(c=>`<span class="mg-c">${esc(c.combo)}`
            +`<s>${(+c.odds).toFixed(1)}倍</s></span>`).join("")
        +`</div>` : "";
    merged = `<div class="mg"><div class="mg-h">全分岐をケアする買い目</div>`
      + frows
      + stat(P0.before, "足切り前")
      + cuts
      + (P0.after ? stat(P0.after, "足切り後") : "")
      + (ME ? `<div class="mg-ref">分岐ごとに満額で買うと <b>${ME.points}点</b>で`
              +`モデル予測 <b>${(ME.p_model*100).toFixed(1)}%</b>`
              +`　※足切りは合成オッズを上げるが回収率は上げない（分散の付け替え）</div>` : "")
      + `</div>`;
  }
  return `<details class="br" open><summary>🔀 展開分岐と買い目`
    +`<span class="upt mid">上位${B.branches.length}分岐で${pc(B.covered)}</span></summary>`
    + merged
    + exactaBlock(r)
    +rows
    +`<div class="br-warn">⚠ 買い目の推奨ではありません（回収率100%超のゾーンは無いと検証済み）</div>`
    +`</details>`;
}

// 展開予想（記者の並び予想=車番のみ1行 ＋ 明示的な展開パターン複数）。出走表と対戦成績の間。
// 男子のライン表示。並びを「1本の隊列」ではなく**ライン単位**で組み、各ラインの強さを
// このレースのモデル分布から出した数値で示す（1着確率の和・ライン決着・3着内）。
// 別の物差し（得点合計など）を混ぜない＝表示と買い目確率が食い違わないようにする。
function lineBlock(r){
  const S = r.line_strength;
  if(!S || !(S.lines||[]).length) return "";
  const pc = v => v==null ? "—" : (v*100).toFixed(1)+"%";
  const settle = S.settle_prob;
  const sCls = settle==null ? "na" : (settle>=0.55 ? "hi" : (settle>=0.40 ? "mid" : "lo"));
  const rows = S.lines.slice().sort((a,b)=>a.rank-b.rank).map(L=>{
    // 競りの2人は同じ pos を持つ。連結子を「－」ではなく「競」にして、
    // どちらが番手になるか未定であることを表示から読み取れるようにする。
    const chips = L.cars.map((c,i)=>{
      const same = i>0 && c.seri && L.cars[i-1].seri && L.cars[i-1].pos===c.pos;
      return `${i>0?(same?`<span class="ln-seri">競</span>`:`<span class="ln-link">－</span>`):""}`
      +`<span class="ln-node${c.seri?" sr":""}">${carChip(c.car)}`
      +`<span class="ln-nm">${esc(c.name||"")}</span>`
      +`<span class="ln-role">${esc(c.pos_label)}`
      +`${c.seri?(c.seri_side?`・${c.seri_side}競り`:"争い"):""}</span>`
      +`<span class="ln-wp">${pc(c.win_prob)}</span></span>`;
    }).join("");
    // 強さバーは「1着確率」。ラインの合計＝1なので相互比較がそのまま成立する
    const w = Math.max(2, Math.round((L.p_win||0)*100));
    return `<div class="ln-row">`
      +`<div class="ln-h"><span class="ln-rank r${L.rank}">${L.rank}位</span>`
      +`<span class="ln-size">${L.size===1?"単騎":L.size+"車"}</span>`
      +(L.score_avg!=null?`<span class="ln-sc">得点平均 ${L.score_avg}</span>`:"")+`</div>`
      +`<div class="ln-cars">${chips}</div>`
      +`<div class="ln-bar"><span style="width:${w}%"></span>`
      +`<b>1着 ${pc(L.p_win)}</b></div>`
      +`<div class="ln-mets">`
      +`<span>ライン決着 <b>${pc(L.p_12)}</b></span>`
      +`<span>3着内に1名以上 <b>${pc(L.p_top3_any)}</b></span></div>`
      +`</div>`;
  }).join("");
  const base = S.settle_baseline;
  return `<details class="ln" open><summary>🔗 ライン別の強さ`
    +(settle!=null?`<span class="upt ${sCls}">ライン決着 ${pc(settle)}</span>`:"")
    +(base!=null?`<span class="ln-base">実測基準 ${pc(base)}</span>`:"")+`</summary>`

    +rows
    +`</details>`;
}

function devBlock(r){
  const D = r.development;
  if(!D) return "";
  // 並び予想: 車番のみ・1行（スペース節約。選手名/脚質は出走表参照）
  // **▶はライン間の区切りだけ**に使う。ライン内は地続きなので詰めて並べる（987▶143▶25▶6）。
  // ライン内にも▶を打つと、隊列が1本の直列に見えてライン構造が読み取れなくなる。
  // 競り（同じ位置を争う）は記者の並び予想と同じくカッコで括る（2(71)45）。
  const seriOf = {}; (r.seri||[]).forEach((g,i)=>g.forEach(c=>seriOf[c]=i));
  const mk = marksOf(r);
  // lines が無い（並び予想を取れなかった）場合は隊列順の1本として描く
  const groups = (r.lines||[]).length ? r.lines : [(D.line||[]).map(s=>s.car)];
  // 印は車番の**上**、地元/地区は車番の**下**。横に並べると「◎7」が1つの塊に見えて
  // 車番が読みにくいため、1車を縦3段（印・車番・地元）にする。
  const hm = {};
  (r.riders||[]).forEach(x=>{ hm[x.car] = x.home ? "地元" : (x.home_dist ? "地区" : ""); });
  const node = c =>
    `<span class="dev-node${seriOf[c]!=null?" sr":""}">`
    +`<span class="dev-mk">${markChip(mk[c])}</span>${carChip(c)}`
    +`<span class="dev-hm${hm[c]==="地元"?" me":(hm[c]?" ds":"")}">${hm[c]||""}</span></span>`;
  const chips = groups.map(mem=>{
    let h = "", open = null;
    mem.forEach((c,i)=>{
      // 非競りは必ず null に揃える（undefined と混ぜない）。`??` は使わない——
      // このファイルの構文検査に使う esprima が未対応で、静的チェックが効かなくなる
      const g = seriOf[c]===undefined ? null : seriOf[c];
      if(g!==open){
        if(open!=null) h += `<span class="dev-paren">)</span>`;
        if(g!=null)    h += `<span class="dev-paren">(</span>`;
        open = g;
      }
      h += node(c);
    });
    if(open!=null) h += `<span class="dev-paren">)</span>`;
    return `<span class="dev-grp">${h}</span>`;
  }).join(`<span class="dev-arrow">▶</span>`);
  const narabi = (D.line||[]).length
    ? `<div class="dev-narabi-h">並び予想（左=先頭・車番のみ）</div><div class="dev-line">${chips}</div>` : "";
  // 隊列位置別の1着確率。前→後の並びで横棒にし、前残りか後方一気かを俯瞰できるようにする。
  // 順序尺度なのでカテゴリカル配色ではなく単一色相のランプ（前=濃、後=淡）を使う。
  const POS_ORDER = ["先行・主導権型","番手抜け出し型","中団抜け出し型(捲り)","後方一気型","位置不明"];
  const nameOf = {};
  (r.riders||[]).forEach(x=>{ if(x && x.car!=null) nameOf[x.car] = x.name||""; });
  const ordered = (D.patterns||[]).slice().sort((a,b)=>{
    const ia = POS_ORDER.indexOf(a.label), ib = POS_ORDER.indexOf(b.label);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  const pmax = Math.max(0.01, ...ordered.map(p=>p.prob||0));
  const pats = ordered.map(p=>{
    const i = POS_ORDER.indexOf(p.label);
    const cls = i>=0 && i<4 ? `s${i}` : "sx";
    const favB = p.has_fav ? `<span class="dev-fav">◎</span>` : "";
    const mem = (p.cars||[]).map(c=>
      `<span class="pp-m">${carChip(c)}<span class="pp-mn">${esc(nameOf[c]||"")}</span>`
      +`${c===p.lead_car?favB:""}</span>`).join("");
    return `<div class="pp-row">`
      +`<div class="pp-h"><span class="pp-i">${esc(p.icon||"")}</span>`
      +`<span class="pp-l">${esc(p.label)}</span>`
      +`<span class="pp-p">${(p.prob*100).toFixed(0)}%</span></div>`
      +`<div class="pp-bar"><span class="${cls}" style="width:${Math.round((p.prob/pmax)*100)}%"></span></div>`
      +`<div class="pp-mem">${mem}</div>`
      +`</div>`;
  }).join("");
  const patBlock = pats
    ? `<div class="dev-pat-h">隊列位置別の1着確率（記者の並び予想による分解・前→後の順）</div>`
      +`<div class="pp">${pats}</div>`
      +`<div class="dev-caveat">※ これは<b>展開の予測ではありません</b>。記者の並び予想で`
      +`「先頭/番手/中団(3〜5番手)/後方(6番手以降)」に分け、各グループの1着確率を合計した値です。`
      +`「後方一気型60%」は<b>後方に置かれた選手が合計60%の確率で勝つ</b>という意味で、`
      +`後方から一気に来る展開が60%起きるという意味ではありません。`
      +`主役＝そのグループで最も1着確率が高い車。`
      +`並び予想自体の的中は弱く（予想先頭が実際にバックを取る率≒20%）、`
      +`実測に基づく展開は下の「展開シナリオ」を参照してください。</div>` : "";
  // 推定主導権（展開AI＝最終バック先頭B。記者予想より当たる）
  const B = D.backstretch;
  let bsBlock = "";
  if(B && B.lead_car!=null){
    const div = B.diverges
      ? `<span class="dev-div">⚠ 記者予想先頭(${B.reporter_front}番)と相違</span>`
      : `<span class="dev-agree">✓ 記者予想先頭と一致</span>`;
    const fade = (D.pace && D.pace.level==="ハイ") ? ` <span class="dev-div">⚠ ハイペースで垂れ注意</span>` : "";
    // 全車の主導権確率。展開AIが学習しているのは「Bを取るのは誰か」だけなので、
    // これは"Bを取る可能性の順位"であって隊列（2番手/3番手…）の予測ではない。
    // 2番手以降は正解データが存在せず学習不能（検証済み）なので、そう明記して出す。
    const nm = {};
    (r.riders||[]).forEach(x=>{ if(x && x.car!=null) nm[x.car] = x.name||""; });
    const favCar = ((r.riders||[])[0]||{}).car;
    const pr = Object.entries(B.probs||{}).map(([c,p])=>[+c, p])
      .sort((a,b)=> b[1]-a[1]);
    const pmaxB = pr.length ? Math.max(...pr.map(x=>x[1])) : 1;
    const rows = pr.map(([c,p],i)=>{
      const tags = (c===favCar?`<span class="dev-fav">◎</span>`:"")
        + (c===B.reporter_front?`<span class="bs-tag">記者予想先頭</span>`:"");
      return `<div class="bs-row"><span class="bs-car">${carChip(c)}`
        +`<span class="bs-nm">${esc(nm[c]||"")}</span>${tags}</span>`
        +`<span class="bs-bar"><span class="${i===0?"top":""}" style="width:${Math.round(p/pmaxB*100)}%"></span></span>`
        +`<span class="bs-p">${(p*100).toFixed(0)}%</span></div>`;
    }).join("");
    bsBlock = `<div class="dev-pat-h">推定主導権（展開AI・最終バック先頭B）</div>`
      +`<div class="dev-bs">主導権 ${carChip(B.lead_car)} <b>${(B.lead_p*100).toFixed(0)}%</b>`
      +` <span class="dev-bs-hit">過去実測${(B.hit_rate*100).toFixed(0)}%的中（記者22%）</span></div>`
      +`<div class="dev-bs-div">${div}${fade}</div>`
      +(rows?`<div class="bs-list">${rows}</div>`
        +`<div class="dev-caveat">※ 全車の「バックを取る確率」を高い順に並べたものです。`
        +`<b>隊列（2番手・3番手…）の予測ではありません</b> — 展開AIが学習しているのは`
        +`「Bを取るのは誰か」だけで、2番手以降は結果データに記録が無く学習できません。</div>`:"");
  }
  // ペース読み（先行型の数→ペース→決まり手傾向。表示専用）
  const P = D.pace;
  let paceBlock = "";
  if(P && P.level){
    const km = P.kimarite_hint||{};
    const lv = P.level==="ハイ" ? "hi" : (P.level==="ミドル" ? "mid" : "lo");
    paceBlock = `<div class="dev-pat-h">ペース・バンク読み</div>`
      +`<div class="dev-pace"><span class="dev-pace-lv lv-${lv}">${esc(P.level)}ペース</span>`
      +` <span class="dev-pace-n">先行型 ${P.n_front}人</span>`
      +(P.bank?` <span class="dev-pace-n">${P.bank}mバンク</span>`:"")
      +` <span class="dev-pace-note">${esc(P.note||"")}</span></div>`
      +`<div class="dev-pace-km">決まり手の目安　逃 ${km["逃"]}%／捲 ${km["捲"]}%／差 ${km["差"]}%</div>`
      +(P.b_reliability?`<div class="dev-pace-km">主導権の信頼度　連対 ${P.b_reliability.rentai}%・着外 ${P.b_reliability.gaiji}% — ${esc(P.b_reliability.note||"")}</div>`:"")
      +(P.basis?`<div class="dev-pace-km">根拠　${esc(P.basis)}（バンク長は決まり手への影響がペースより大きい: 逃げ率 333m 35% / 400m 19% / 500m 13%）</div>`:"");
  }
  return `<div class="dev">`
    +`<div class="dev-head">🔀 展開予想 <span class="dev-src">${esc(D.source||"")}</span></div>`
    +bankBlock(r) + narabi + paceBlock

    +`</div>`;
}
// バンク特性（諸元＋統計的な有利脚質）。予測根拠ではなく「どういうバンクか」の説明。
function bankBlock(r){
  const B = r.bank_profile;
