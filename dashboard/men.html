// 展開6パターンの構成比（ドーナツ）。上位3だけでは全体像が見えないので全形を出す。
// 配色は dataviz 検証済みの6スロット固定順。lightで3:1未満の色があるため
// 全スライスに凡例＋数値を直接ラベルとして必ず添える（relief条件）。
function pieBlock(S){
  const all = (S.all||[]).filter(x=>x && x.prob>0);
  if(all.length<2) return "";
  const tot = all.reduce((s,x)=>s+x.prob,0);
  if(!(tot>0)) return "";
  const R=52, r0=30, CX=60, CY=60;
  const pt=(deg,rad)=>{ const a=(deg-90)*Math.PI/180;
    return [(CX+rad*Math.cos(a)).toFixed(2),(CY+rad*Math.sin(a)).toFixed(2)]; };
  let acc=0;
  const paths = all.map((x,i)=>{
    const frac = x.prob/tot;                 // 角度は正規化（端数で輪が閉じないのを防ぐ）
    const a0=acc*360, a1=(acc+frac)*360; acc+=frac;
    const large = (a1-a0)>180 ? 1 : 0;
    const [x0,y0]=pt(a0,R), [x1,y1]=pt(a1,R), [x2,y2]=pt(a1,r0), [x3,y3]=pt(a0,r0);
    const d = `M${x0},${y0}A${R},${R} 0 ${large} 1 ${x1},${y1}`
            + `L${x2},${y2}A${r0},${r0} 0 ${large} 0 ${x3},${y3}Z`;
    return `<path d="${d}" fill="var(--s${i+1})"><title>${esc(x.key)} ${(x.prob*100).toFixed(1)}%</title></path>`;
  }).join("");
  const favWin = all.filter(x=>x.fav_wins).reduce((s,x)=>s+x.prob,0);
  const lg = all.map((x,i)=>
    `<span class="pie-sw" style="background:var(--s${i+1})"></span>`
    +`<span class="pie-nm">${esc(x.key)} <em>${x.fav_wins?"◎勝ち":"◎負け"}</em></span>`
    +`<span class="pie-v">${(x.prob*100).toFixed(1)}%</span>`).join("");
  return `<div class="dev-pat-h" style="margin-top:12px">展開6パターンの構成比</div>`
    +`<div class="pie">`
    +`<svg class="pie-svg" viewBox="0 0 120 120" width="132" height="132" role="img"`
    +` aria-label="展開6パターンの構成比">${paths}`
    +`<text class="pie-c1" x="60" y="54" text-anchor="middle">◎が勝つ</text>`
    +`<text class="pie-c2" x="60" y="70" text-anchor="middle">${Math.round(favWin*100)}%</text>`
    +`</svg><div class="pie-lg">${lg}</div></div>`
    +`<div class="pie-note">①〜③が◎の勝ち方、④〜⑥が◎の負け方。`
    +`各形の割合＝このレースの1着確率×履歴の分岐比。`
    +`合計は${(tot*100).toFixed(1)}%で、残りは標本が少なく統計を出せない稀な形`
    +`（◎が主導権を取らずに逃げ切る等）。</div>`;
}
// 展開シナリオ上位3（◎勝ち/負け×決まり手の6分類。確率=1着確率×履歴の分岐比）
function scenarioBlock(r){
  const S = r.dev_patterns;
  if(!S || !(S.top||[]).length) return "";
  const dist = arr => (arr||[]).map(d =>
    `${esc(d.mark)}${esc(d.car||"")} <b>${Math.round(d.p*100)}%</b>`).join(" / ");
  const items = S.top.map((t,i)=>{
    const lose = !t.fav_wins;
    const w = Math.round(t.prob*100);
    // ◎が勝つ形では勝者は自明なので出さず、負ける形だけ「勝つのは」を見せる
    const winLine = lose
      ? `<div class="sc-line"><span class="sc-lbl">勝つのは</span><span class="sc-dist">${dist(t.winner)}</span></div>` : "";
    const bLine = (lose && t.b_win!=null && t.b_win>=0.3)
      ? `<div class="sc-line"><span class="sc-lbl">うち主導権</span><span class="sc-dist">その車が勝つ <b>${Math.round(t.b_win*100)}%</b></span></div>`
      : ((!lose && t.b_second!=null && t.b_second>=0.2)
        ? `<div class="sc-line"><span class="sc-lbl">主導権</span><span class="sc-dist">2着に <b>${Math.round(t.b_second*100)}%</b></span></div>` : "");
    const favLine = (lose && t.fav_pos)
      ? `<div class="sc-fav">◎の着順　2着 ${Math.round(t.fav_pos["2"]*100)}% ／ 3着 ${Math.round(t.fav_pos["3"]*100)}% ／ 着外 ${Math.round(t.fav_pos.out*100)}%`
        +`　→ <em>3着以内 ${Math.round((t.fav_top3||0)*100)}%</em></div>` : "";
    return `<div class="sc-item${lose?" lose":""}">`
      +`<div class="sc-top"><span class="sc-rank">${i+1}位</span>`
      +`<span class="sc-key">${esc(t.key)}</span>`
      +`<span class="sc-prob">${w}%</span></div>`
      +`<div class="sc-bar"><span style="width:${Math.min(100,w)}%"></span></div>`
      +winLine + bLine
      +`<div class="sc-line"><span class="sc-lbl">2着</span><span class="sc-dist">${dist(t.second)}</span></div>`
      +`<div class="sc-line"><span class="sc-lbl">3着</span><span class="sc-dist">${dist(t.third)}</span></div>`
      +favLine
      +`</div>`;
  }).join("");
  const ins = (S.insights||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  return `<div class="sc">`
    +`<div class="dev-pat-h">展開シナリオ 上位3（過去${(S.n_races||0).toLocaleString()}レースの実測分岐比 × このレースの1着確率）</div>`
    +items
    +pieBlock(S)
    +(ins?`<div class="sc-ins"><span class="h">📌 展開から紐を選ぶときの読み</span><ul>${ins}</ul></div>`:"")
    +(S.note?`<div class="dev-caveat">※ ${esc(S.note)}</div>`:"")
    +`</div>`;
}
// 参考フォーメーション（◎頭固定・補正確率top-K）。実弾非推奨・回収率<100%。
function refBlock(r){
  const R = r.reference;
  if(!R || !(R.combos||[]).length) return "";
  const pk = (R.pockets||[]).length
    ? (R.pockets||[]).map(p=>`<span class="rf-pk">${esc(p)}</span>`).join("")
    : `<span class="rf-pk none">妙味ポケット外</span>`;
  const combos = (R.combos||[]).map(c=>`<span class="rf-combo">${esc(c)}</span>`).join("");
  const hist = Object.keys(R.hist||{}).sort((a,b)=>(+a)-(+b)).map(k=>{
    const h = R.hist[k];
    return `<tr><td>${k}点</td><td>${(+h.hit).toFixed(1)}%</td><td>${(+h.roi).toFixed(1)}%</td></tr>`;
  }).join("");
  return `<div class="rf">`
    +`<div class="rf-head">🧭 参考フォーメーション（◎頭固定・${R.points}点） ${pk}</div>`
    +`<div class="rf-combos">${combos}</div>`
    +(R.model_hit_pct!=null?`<div class="rf-model">このレースのモデル想定的中率（${R.points}点合計）: <b>${(+R.model_hit_pct).toFixed(1)}%</b></div>`:"")
    +`<div class="rf-hist"><div class="rf-hist-t">過去実測（${esc(R.primary)}・ポケット平均, out-of-sample）</div>`
    +`<div class="tblwrap"><table class="t"><thead><tr><th>点数</th><th>的中率</th><th>回収率</th></tr></thead><tbody>${hist}</tbody></table></div></div>`
    +`<div class="rf-note">⚠️ ${esc(R.note||"")} <b>回収率は全て100%未満＝実弾投入は非推奨</b>。的中率で点数を選ぶ“参考”用です。</div>`
    +`</div>`;
}
// 1レースのブロック。結果確定後は「予測／確定結果」をタブで分ける（tab: 'pred'|'res'）。
function raceBlock(r, tab){
  const hasRes = !!(r.result && (r.result.order||[]).length);
  let inner;
  if(hasRes){
    const t = tab==="res" ? "res" : "pred";
    inner = `<div class="rc-tabs" role="tablist" aria-label="予測と結果の切替">`
      +`<button class="rc-tab" type="button" role="tab" data-rc="pred" aria-selected="${t==="pred"}" tabindex="${t==="pred"?0:-1}">予測</button>`
      +`<button class="rc-tab" type="button" role="tab" data-rc="res" aria-selected="${t==="res"}" tabindex="${t==="res"?0:-1}">🏁 確定結果</button>`
      +`</div>`
      +`<div class="rc-pane"${t==="res"?" hidden":""}>${predContent(r)}</div>`
      +`<div class="rc-pane"${t==="res"?"":" hidden"}>${resultBlock(r)}</div>`;
  } else {
    inner = predContent(r);
  }
  return `<div class="pred-race">${raceHead(r)}${inner}</div>`;
}
// raceBlock が出したセレクタ（EV買い目の1着車・三連単オッズ表の1着固定）の配線。
// 男子セクションも同じ raceBlock を描くので、ホスト要素を引数にして共有する。
function wireRaceControls(h){
  // 選手バッジ → その選手の詳細行を開閉。行の再描画をしないのでスクロール位置が動かない
  h.querySelectorAll("[data-ls]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const row = btn.closest("table").querySelector(`[data-lsrow="${btn.dataset.ls}"]`);
      if(!row) return;
      const open = row.hasAttribute("hidden");
      row.toggleAttribute("hidden", !open);
      btn.setAttribute("aria-expanded", open?"true":"false");
      btn.classList.toggle("on", open);
    });
  });
  h.querySelectorAll(".ev-tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const uid=btn.dataset.ev, car=+btn.dataset.car;
      h.querySelectorAll(`.ev-tab[data-ev="${uid}"]`).forEach(b=>{
        const on=(+b.dataset.car===car);
        b.setAttribute("aria-selected", on?"true":"false");
        b.tabIndex = on?0:-1;
      });
      const grid=h.querySelector("#ev-grid-"+uid);
      if(grid) grid.innerHTML=renderEvGrid(uid,car);
    });
  });
  h.querySelectorAll(".om-tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const uid=btn.dataset.om, car=+btn.dataset.car;
      h.querySelectorAll(`.om-tab[data-om="${uid}"]`).forEach(b=>{
        const on=(+b.dataset.car===car);
        b.setAttribute("aria-selected", on?"true":"false");
        b.tabIndex = on?0:-1;
      });
      const grid=h.querySelector("#om-grid-"+uid);
      if(grid) grid.innerHTML=renderOmGrid(uid,car);
      const lab=h.querySelector("#om-lab-"+uid);
      if(lab) lab.textContent="1着 "+car+" 固定";
    });
  });
}

// ---- 男子: 会場カード → レース一覧 → レース詳細 ----
// ガールズ(1会場3〜5R)と違い男子は1日約130R・十数会場。会場タブを全部並べる方式は
// 成立しないので3階層にする。データも data_men.json で独立。
function bootMen(DB){
  const P = DB.predictions||{};
  FORM_STATS = (DB.formation_stats||{}).kinds || {};   // 型別の実測（的中率・回収率）
  const host = document.getElementById("menBody");
  const all = (P.races||[]).filter(r=>r.is_girls===false);
  document.getElementById("menTitle").innerHTML = "男子競輪の予測 "+badge(all.length?P.status:"pending");
  document.getElementById("gen").textContent = P.last_updated ? ("更新 "+P.last_updated) : "";
  if(!all.length){
    host.innerHTML = emptyBox("男子の予測はまだ生成されていません。"
      + "build_predictions.py を --include all で実行すると生成されます。");
    return;
  }
  document.getElementById("menSub").textContent =
    ((P.dates&&P.dates.length)?`対象 ${P.dates[0]}〜${P.dates[P.dates.length-1]}　`:"")
    + `${all.length}レース` + (P.model?`　モデル ${P.model}`:"");

  const today = P.date||"";
  const dates = [...new Set(all.map(r=>r.date).filter(Boolean))].sort();
  let selDate = dates.includes(today) ? today : (dates[0]||null);
  let selVenue = null, selRace = null, rcOverride = null;

  const DOW=["日","月","火","水","木","金","土"];
  const dlabel = d => { const t=new Date(d+"T00:00:00Z");
    const rel = !today ? "" : (d===today?"今日":(d<today?"昨日":"明日"));
    return `${rel} ${d.slice(5).replace("-","/")}(${DOW[t.getUTCDay()]})`; };
  const short = v => String(v||"").replace(/競輪場?$/,"");
  // 進行状況はデータに無い派生値。build時刻ではなく**閲覧時刻**で判定する。
  function mins(r){
    if(!r.deadline||!String(r.deadline).includes(":")) return null;
    const [h,m]=String(r.deadline).split(":").map(Number);
    const n=new Date();
    let d=h*60+m-(n.getHours()*60+n.getMinutes());
    if(r.date && today && r.date!==today) d += (r.date>today?1440:-1440);   // 日跨ぎ
    return d;
  }
  // done=確定 / live=発売中 / wait=締切済だが結果未取得 / yet=発売前。
  // wait を live に混ぜない: 締切を過ぎたレースを「発売中」と出すと買えると誤解させる。
  function status(r){
    if(r.result&&(r.result.order||[]).length) return "done";
    const m=mins(r);
    if(m==null) return "yet";
    if(m<-5) return "wait";
    return m<=60 ? "live" : "yet";
  }
  const relTime = m => m==null ? "" :
    (m<0 ? "締切" : (m<=5 ? "締切間近" : (m<60 ? `あと${m}分` : `あと${Math.floor(m/60)}時間${m%60}分`)));

  function byVenue(races){
    const m=new Map();
    races.forEach(r=>{ const k=r.venue||"—"; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); });
    for(const v of m.values()) v.sort((a,b)=>(a.race_no||0)-(b.race_no||0));
    return [...m.entries()].sort((a,b)=>
      String(a[1][0].deadline||"~").localeCompare(String(b[1][0].deadline||"~")));
  }

  // ---- 上部固定の2段タブ（会場→レース）。1レースだけを縦に全部出す ----
  // 会場カードの階層を廃止し、切り替えを画面上部に集約する。同時開催が十数場あるので
  // 「会場を選ぶ→その会場のRを選ぶ」の2段にする（全会場のRを1本に並べると混ざる）。
  function pickDefault(races){
    if(!races.length){ selVenue=selRace=null; return; }
    const has = races.some(r=>r.venue===selVenue);
    if(!has) selVenue=null;
    if(!selVenue){
      // 既定は「次に買える会場」。全部終わっていれば最後に締め切った会場
      const live = races.filter(r=>{const t=status(r);return t==="live"||t==="yet";})
        .sort((a,b)=>String(a.deadline||"~").localeCompare(String(b.deadline||"~")));
      selVenue = (live[0] || races[races.length-1]).venue;
      selRace = null;
    }
    const rs = races.filter(r=>r.venue===selVenue).sort((a,b)=>(a.race_no||0)-(b.race_no||0));
    if(!rs.some(r=>r.race_no===selRace)){
      const nxt = rs.find(r=>{const t=status(r);return t==="live"||t==="yet";});
      const pick = nxt || rs[rs.length-1];       // `??` は使わない（esprima が未対応）
      selRace = pick ? pick.race_no : null;
    }
  }

  function renderTabs(races){
    const vs = byVenue(races);
    const rs = races.filter(r=>r.venue===selVenue).sort((a,b)=>(a.race_no||0)-(b.race_no||0));
    const cur = rs.find(r=>r.race_no===selRace);
    const bp = (rs[0]||{}).bank_profile||{};
    const done = rs.filter(r=>status(r)==="done").length;
    let h = `<div class="tabwrap">`;
    h += `<div class="tabbar" role="tablist" aria-label="会場切替">`
      + vs.map(([v,vr])=>{
          const nx = vr.slice().sort((a,b)=>String(a.deadline||"~").localeCompare(String(b.deadline||"~")))
            .find(r=>{const t=status(r);return t==="live"||t==="yet";});
          const md=(vr.find(x=>x.meet_day!=null)||{}).meet_day;
          const isFinal=vr.some(x=>x.role&&x.role.role==="決勝");
          const dl=isFinal?"最終日":(md!=null?md+"日目":"");
          return `<button class="vtab" type="button" role="tab" data-venue="${esc(v)}"`
            +` aria-selected="${v===selVenue?"true":"false"}">${esc(short(v))}`
            +`${dl?`<b class="vday">${esc(dl)}</b>`:""}`
            +`<small>${nx?`次${nx.race_no}R ${esc(nx.deadline||"")}`:"終了"}</small></button>`;
        }).join("")
      + `</div>`;
    // レースタブに万車券率を出す。どのレースが荒れやすいかを開かずに俯瞰するため。
    // 色は .upt と同じ lo/mid/hi。検証を通していない層（9車）は値が無いので「—」。
    h += `<div class="tabbar" role="tablist" aria-label="レース切替">`
      + rs.map(r=>{
          const u = upsetOf(r);
          // 確定済みは**表示していた買い目が当たったか**で枠色を変える（開かずに分かる）
          const hv = planHit(r);
          const hc = hv==null ? "" : (hv ? " hit" : " miss");
          const ht = hv==null ? "" : (hv ? "｜買い目 的中" : "｜買い目 不的中");
          return `<button class="rtab ${status(r)}${hc}" type="button" role="tab" data-race="${r.race_no}"`
            +` aria-selected="${r.race_no===selRace?"true":"false"}"`
            +` title="${r.race_no}R 締切${esc(r.deadline||"--")}｜万車券率 ${u==null?"—":pct1(u)}${ht}">`
            +`${r.race_no}R<small>${esc(r.deadline||"--")}</small>`
            +`<small class="rt-up ${uptCls(u)}">${u==null?"—":Math.round(u*100)+"%"}</small>`
            +`</button>`;
        }).join("")
      + `</div>`;
    h += `<div class="tablegend">レース番号の下は<b>万車券率</b>（払戻1万円以上の確率・実測較正）`
      + `<span class="upt lo">低</span><span class="upt mid">中</span><span class="upt hi">高</span>`
      + `<span class="upt na">—</span>9車は未検証`
      + `　<b class="lg-hit">緑枠</b>＝確定済みで買い目が的中</div>`;
    h += `<div class="tabhead"><span class="nm">${esc(short(selVenue||""))}</span>`
      + ((rs[0]||{}).grade?`<span class="gbadge">${esc(rs[0].grade)}</span>`:"")
      + ((rs[0]||{}).class_group?`<span>${esc(rs[0].class_group)}</span>`:"")
      + (bp.bank?`<span>${esc(bp.bank)}m・直線${esc(bp.straight)}m</span>`:"")
      + `<span>済 ${done}/${rs.length}R</span>`
      + (cur&&cur.race_name?`<span>${esc(cur.race_name)}</span>`:"")
      + `</div></div>`;
    return h;
  }

  function render(){
    const races = all.filter(r=>r.date===selDate);
    // 「紐補正なし」とは書かない。A-3で男子専用パラメータを採用済みで、事実と食い違うため。
    let html = `<div class="pred-disc">⚠ 着順確率の提示です。買い目の推奨ではありません。</div>`;
    if(dates.length>1){
      html += `<div class="pred-dtabs" role="tablist" aria-label="日付切替">`
        + dates.map(d=>`<button class="pred-dtab" type="button" role="tab" data-mdate="${esc(d)}"`
          +` aria-selected="${d===selDate?"true":"false"}">${esc(dlabel(d))}`
          +`<span class="vc">${all.filter(r=>r.date===d).length}R</span></button>`).join("")
        + `</div>`;
    }
    pickDefault(races);
    if(!selVenue){
      html += emptyBox("この日のレースがありません。");
    }else{
      const r = races.find(x=>x.venue===selVenue && x.race_no===selRace);
      html += renderTabs(races)
        + (r ? raceBlock(r, rcOverride || ((r.result&&(r.result.order||[]).length)?"res":"pred"))
             : emptyBox("レースが見つかりません。"));
    }
    host.innerHTML = html;
    attach();
  }

  function attach(){
    host.querySelectorAll("[data-mdate]").forEach(b=>b.addEventListener("click",()=>{
      selDate=b.dataset.mdate; selVenue=null; selRace=null; rcOverride=null;
      render(); window.scrollTo(0,0);
    }));
    const go=(el,fn)=>{ el.addEventListener("click",fn);
      el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } }); };
    // 会場を変えたらレースは選び直す（同じR番号が別会場にもあるので引き継がない）
    host.querySelectorAll("[data-venue]").forEach(el=>go(el,()=>{
      selVenue=el.dataset.venue; selRace=null; rcOverride=null; render(); window.scrollTo(0,0);
    }));
    // レース切替はタブ位置を保ちたいので先頭へは戻さない（切替のたびに飛ぶと使いにくい）
    host.querySelectorAll("[data-race]").forEach(el=>go(el,()=>{
      selRace=+el.dataset.race; rcOverride=null; render();
    }));
    // 予測／確定結果 タブ（レース詳細内）。スクロール位置は動かさない
    host.querySelectorAll(".rc-tab").forEach(t=>{
      t.addEventListener("click",()=>{ rcOverride=t.dataset.rc; render(); });
    });
    wireRaceControls(host);
  }
  render();

  // 説明文は置かない。ここは「買い目ではない」ことだけを残す（消すと買い目に見えるため）。
  document.getElementById("foot").innerHTML =
    "男子競輪の3連単予測AI（モデル・統計ともガールズとは別系統）。"
    + "<b>買い目の推奨ではありません。</b>";
}


// ---- theme toggle (light/dark, persisted). ガールズ側とキーを共有して設定を引き継ぐ ----
(function(){
  const KEY="gk_theme";
  const saved=localStorage.getItem(KEY);
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  document.addEventListener("click",e=>{
    if(e.target.closest && e.target.closest("#themeBtn")){
      const cur=document.documentElement.getAttribute("data-theme")
        || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
      const next=cur==="dark"?"light":"dark";
      document.documentElement.setAttribute("data-theme",next);
      localStorage.setItem(KEY,next);
    }
    // 種別バッジをタップで勝ち上がり説明をトグル（PWA/タッチ対応）
    const rb=e.target.closest&&e.target.closest(".rrole");
    if(rb){ const pop=rb.nextElementSibling; if(pop&&pop.classList.contains("rrole-pop")) pop.hidden=!pop.hidden; }
  });
})();

// ---- data load: 男子は data_men.json（ガールズの data.json とは別ファイル）----
// 更新ボタン: 押すと取り直し、**last_updated が進んでいる時だけ**描き直す。
// 毎回描き直すと開いていた詳細やタブ選択が畳まれるので、変化が無ければ触らない。
let CUR_UPDATED = null;
(function(){
  const btn = document.getElementById("reloadBtn");
  const msg = document.getElementById("reloadMsg");
  function load(manual){
    if(btn) btn.disabled = true;
    if(manual && msg) msg.textContent = "確認中…";
    return fetch("./data_men.json?t="+Date.now(), {cache:"no-store"})
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(DB=>{
        const up = (DB.predictions||{}).last_updated || null;
        if(manual && up && up === CUR_UPDATED){
          if(msg){ msg.textContent = "最新です"; setTimeout(()=>{msg.textContent="";}, 3000); }
          return;
        }
        CUR_UPDATED = up;
        bootMen(DB);
        if(manual && msg){
          msg.textContent = "更新しました";
          setTimeout(()=>{msg.textContent="";}, 3000);
        }
      })
      .catch(e=>{
        if(manual){
          if(msg){ msg.textContent = "取得失敗"; setTimeout(()=>{msg.textContent="";}, 4000); }
          return;
        }
        document.getElementById("menBody").innerHTML =
          '<div class="empty">データ読込エラー: '+e+'<br>data_men.json を同じフォルダに置き、'
          +'サーバ経由（GitHub Pages 等）で開いてください。</div>';
      })
      .finally(()=>{ if(btn) btn.disabled = false; });
  }
  if(btn) btn.addEventListener("click", ()=>load(true));
  load(false);
})();

// PWA: サービスワーカー登録（ガールズ側と同一のSWを共有）
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  });
}
</script>
